<script>
/* ============ utilidades ============ */
const KEY='acai_caixa_v1';
const $=s=>document.querySelector(s);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const r2=n=>Math.round((n+Number.EPSILON)*100)/100;
const r4=n=>Math.round(n*10000)/10000;
const brl=n=>(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const num=n=>(n||0).toLocaleString('pt-BR',{maximumFractionDigits:3});
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const dia=ts=>{const d=new Date(ts);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const hoje=()=>dia(Date.now());
const hora=ts=>pad(new Date(ts).getHours());
const fdata=ts=>new Date(ts).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'});
const fdia=d=>d.split('-').reverse().join('/');
const pn=v=>{v=String(v==null?'':v).trim();if(v.includes(','))v=v.replace(/\./g,'').replace(',','.');return parseFloat(v)||0};
const fin=n=>String(n==null?0:n).replace('.',',');
const FORMAS=[{k:'din',n:'Dinheiro',c:'ok'},{k:'pix',n:'Pix',c:''},{k:'deb',n:'Cartão Débito',c:'am'},{k:'cre',n:'Cartão Crédito',c:'am'}];
const FN=k=>(FORMAS.find(f=>f.k===k)||{n:k}).n;

/* ============ dados ============ */
const DEF=()=>({v:1,params:{nome:'Minha Açaiteria',taxaDebito:1.5,taxaCredito:3.5,taxaPix:0,metaDia:1000,metaMes:25000,estoqueMin:5,pin:'',rodape:'Obrigado pela preferência!',catProd:['Açaí','Adicionais','Bebidas','Outros'],catDesp:['Aluguel','Energia','Água','Funcionários','Marketing','Embalagens','Internet','Outros'],lastBackup:0,tema:'claro'},produtos:[],insumos:[],compras:[],despesas:[],caixas:[],movs:[],vendas:[],ajustes:[],seq:0});
let db,modoServidor=true,svOk=true,fila=Promise.resolve(),pend=0,persistido=null,dirtyMes=new Set(),dirtyTudo=false;
/* Banco no próprio iPad (IndexedDB): 1 registro "core" (cadastros, caixas, compras, despesas) + 1 registro por mês de vendas.
   A cada venda só o mês corrente é regravado, então continua rápido com anos de histórico. */
const IDB={db:null,
  open(){return new Promise((res,rej)=>{const r=indexedDB.open('acaiteria',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>{this.db=r.result;res()};r.onerror=()=>rej(r.error);r.onblocked=()=>rej(new Error('bloqueado'))})},
  tx(mode,fn){return new Promise((res,rej)=>{const t=this.db.transaction('kv',mode),st=t.objectStore('kv');let out;try{out=fn(st)}catch(e){rej(e);try{t.abort()}catch(_){}return}t.oncomplete=()=>res(out&&out.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error||new Error('abort'))})}
};
const FAIXA_V=()=>IDBKeyRange.bound('v:','v:\uffff');
const chaveMes=ts=>{const d=new Date(ts);return d.getFullYear()+'-'+pad(d.getMonth()+1)};
function marcarMes(ts){dirtyMes.add(chaveMes(ts))}
function vendasDoMes(m){const p=m.split('-').map(Number),a=new Date(p[0],p[1]-1,1).getTime(),b=new Date(p[0],p[1],1).getTime();return db.vendas.filter(v=>v.ts>=a&&v.ts<b)}
function aplicarTema(){document.documentElement.dataset.tema=(db&&db.params&&db.params.tema)==='escuro'?'escuro':'claro'}
function alternarTema(){db.params.tema=db.params.tema==='escuro'?'claro':'escuro';try{localStorage.setItem('acai_tema',db.params.tema)}catch(e){}aplicarTema();save();render()}
function normalizar(){
  const d=DEF();db.params=Object.assign({},d.params,db.params);
  for(const k of Object.keys(d))if(db[k]===undefined)db[k]=d[k];
  aplicarTema();
}
function tagSave(){
  const e=$('#svt');if(!e)return;
  e.className='tag '+(svOk?'g':'r');
  e.textContent=svOk?(pend?'Salvando…':'💾 Salvo no iPad'):'⚠ NÃO SALVO — faça um backup já!';
}
function save(tudo){
  if(tudo)dirtyTudo=true;
  const core=Object.assign({},db);delete core.vendas;
  const todos=dirtyTudo,meses=[...dirtyMes];dirtyMes.clear();dirtyTudo=false;
  const blocos={};
  if(todos){for(const v of db.vendas){const m=chaveMes(v.ts);(blocos[m]=blocos[m]||[]).push(v)}}
  else for(const m of meses)blocos[m]=vendasDoMes(m);
  pend++;tagSave();
  fila=fila.then(()=>IDB.tx('readwrite',st=>{
      if(todos)st.delete(FAIXA_V());
      st.put(core,'core');
      for(const m in blocos)st.put(blocos[m],'v:'+m);
    }))
    .then(()=>{svOk=true})
    .catch(()=>{svOk=false;dirtyTudo=true})
    .then(()=>{pend--;tagSave()});
}
window.addEventListener('beforeunload',e=>{if(pend||!svOk){e.preventDefault();e.returnValue=''}});
const ehIOS=()=>/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const instalado=()=>navigator.standalone===true||(window.matchMedia&&matchMedia('(display-mode: standalone)').matches);
const precisaInstalar=()=>ehIOS()&&!instalado();
function ajudaInstalar(){
  modal('<h3>Instalar na Tela de Início</h3><p>Para os dados ficarem protegidos no iPad, use o sistema <b>pelo ícone instalado</b>, e não pelo Safari.</p>'
   +'<ol style="padding-left:20px;line-height:1.7"><li>No Safari, toque no botão <b>Compartilhar</b> (quadrado com seta para cima).</li><li>Role e toque em <b>Adicionar à Tela de Início</b>.</li><li>Toque em <b>Adicionar</b>.</li><li>Feche o Safari e abra o <b>Caixa Açaí</b> pelo ícone novo.</li></ol>'
   +'<p class="warn">Atenção: o que for lançado no Safari <b>não passa</b> para o app instalado. Instale primeiro e só depois comece a lançar.</p><div class="acts"><button class="btn" onclick="fechar()">Entendi</button></div>');
}
async function boot(){
  try{if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0)navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().then(r=>{persistido=r}).catch(()=>{})}catch(e){}
  try{await IDB.open()}catch(e){
    document.body.innerHTML='<div style="max-width:560px;margin:60px auto;font-family:sans-serif;padding:16px"><h2>Este navegador não permite guardar dados</h2><p>Abra o sistema pelo ícone instalado na Tela de Início (e não em aba privada). Nada foi apagado.</p></div>';return;
  }
  let core;
  try{
    core=await IDB.tx('readonly',st=>st.get('core'));
    if(core){
      const blocos=await IDB.tx('readonly',st=>st.getAll(FAIXA_V()));
      core.vendas=[].concat.apply([],blocos);core.vendas.sort((a,b)=>a.ts-b.ts);
      db=core;
    }else db=DEF();
  }catch(e){
    document.body.innerHTML='<div style="max-width:560px;margin:60px auto;font-family:sans-serif;padding:16px"><h2>Não foi possível ler os dados</h2><p>Nada foi alterado. Feche e abra o app de novo. Se continuar, restaure o último backup.</p></div>';return;
  }
  normalizar();render();
}
const caixaAberto=()=>db.caixas.find(c=>c.status==='aberto');
const insumo=id=>db.insumos.find(i=>i.id===id);
const taxaForma=k=>({din:0,pix:db.params.taxaPix,deb:db.params.taxaDebito,cre:db.params.taxaCredito}[k]||0);
function custoProd(p){
  if(p.receita&&p.receita.length)return r4(p.receita.reduce((s,r)=>{const i=insumo(r.ins);return s+(i?i.custo*r.qtd:0)},0));
  return p.custo||0;
}
function pinOk(){
  if(!db.params.pin)return true;
  const x=prompt('Digite o PIN do gerente:');
  if(x===null)return false;
  if(x===db.params.pin)return true;
  alert('PIN incorreto.');return false;
}

/* ============ AJUDA (i) ============ */
const AJ_EXATO=new Map(Object.entries({

"Metas": "Quanto você já vendeu em relação às metas diária e mensal definidas em Parâmetros.",

function chaveAj(el){
  let t='';
  if(el.tagName==='LABEL'){for(const n of el.childNodes)if(n.nodeType===3)t+=n.nodeValue}
  else for(const n of el.childNodes){if(n.nodeType===3)t+=n.nodeValue;else if(n.nodeType===1&&!n.classList.contains('ib'))t+=n.textContent}
  return t.replace(/\s+/g,' ').replace(/^[^\p{L}\p{N}]+/u,'').trim();
}
function acharAj(k,t){const h=AJ_EXATO.get(tela+'|'+k)||AJ_EXATO.get(k);if(h)return h;const r=AJ_REGEX.find(a=>a[0].test(t));return r?r[1]:null}
function decorar(root){
  (root||document).querySelectorAll('h2,h3,h4,th,label,.kpi small,nav a').forEach(el=>{
    if(el.querySelector(':scope > .ib'))return;
    const t=chaveAj(el);if(!t)return;
    const k=(el.tagName==='A'?'nav:':el.tagName==='TH'?'th:':'')+t;const h=acharAj(k,t);if(!h){(window.__sem=window.__sem||[]).push(t);return}
    const i=document.createElement('span');i.className='ib';i.tabIndex=0;i.setAttribute('role','button');i.setAttribute('aria-label','O que é: '+t);i.title='Clique para ver o que é';i.textContent='i';
    i.dataset.t=t;i.dataset.h=h;
    const f=el.tagName==='LABEL'&&!el.classList.contains('chk')?el.querySelector('input,select,textarea'):null;
    if(f&&f.parentNode===el)el.insertBefore(i,f);else el.appendChild(i);
  });
}
function mostrarAj(b){
  const pop=$('#pop');
  if(pop.style.display==='block'&&pop.dataset.dono===b.dataset.t+b.dataset.h&&pop._b===b){fecharAj();return}
  pop.innerHTML='';const tt=document.createElement('b');tt.textContent=b.dataset.t.replace(/\s*[—:(].*$/,'')||b.dataset.t;pop.appendChild(tt);
  b.dataset.h.split('\n').forEach((l,k)=>{if(k)pop.appendChild(document.createElement('br'));pop.appendChild(document.createTextNode(l))});
  pop.dataset.dono=b.dataset.t+b.dataset.h;pop._b=b;pop.style.display='block';
  const r=b.getBoundingClientRect(),w=pop.offsetWidth,h=pop.offsetHeight;
  let x=Math.min(Math.max(8,r.left-8),innerWidth-w-8),y=r.bottom+8;if(y+h>innerHeight-8)y=Math.max(8,r.top-h-8);
  pop.style.left=x+'px';pop.style.top=y+'px';
}
function fecharAj(){const p=$('#pop');if(p){p.style.display='none';p._b=null}}
document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('.ib');if(b){e.preventDefault();e.stopPropagation();mostrarAj(b)}else if(!e.target.closest('#pop'))fecharAj()},true);
document.addEventListener('keydown',e=>{if(e.key==='Escape')fecharAj();else if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('ib')){e.preventDefault();mostrarAj(e.target)}});
window.addEventListener('resize',fecharAj);

async function baixar(nome,txt,mime){
  mime=mime||'text/plain';
  try{const f=new File([txt],nome,{type:mime});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:nome});return true}}
  catch(e){if(e&&e.name==='AbortError')return false}
  const bl=new Blob([txt],{type:mime}),an=document.createElement('a');an.href=URL.createObjectURL(bl);an.download=nome;document.body.appendChild(an);an.click();
  setTimeout(()=>{URL.revokeObjectURL(an.href);an.remove()},4000);return true;
}

function limites(a,b){const x=a.split('-').map(Number),y=b.split('-').map(Number);return[new Date(x[0],x[1]-1,x[2]).getTime(),new Date(y[0],y[1]-1,y[2]+1).getTime()]}
function vendasEntre(a,b){const l=limites(a,b);return db.vendas.filter(v=>v.ts>=l[0]&&v.ts<l[1])}
function vendasPeriodo(a,b){const l=limites(a,b);return db.vendas.filter(v=>v.status==='ok'&&v.ts>=l[0]&&v.ts<l[1])}
function despPeriodo(a,b){return db.despesas.filter(d=>d.data>=a&&d.data<=b)}
function resumo(vs){
  const r={n:vs.length,sub:0,desc:0,total:0,taxas:0,cmv:0,porForma:{din:0,pix:0,deb:0,cre:0},porProd:{},porCat:{},porDia:{},porHora:{}};
  for(const v of vs){
    r.sub+=v.subtotal;r.desc+=v.desconto;r.total+=v.total;r.taxas+=v.taxas||0;
    for(const p of v.pags)r.porForma[p.forma]=(r.porForma[p.forma]||0)+p.valor;
    const f=v.subtotal?v.total/v.subtotal:1;
    for(const i of v.itens){
      const rec=i.qtd*i.preco*f,c=i.qtd*i.custo;r.cmv+=c;
      const o=r.porProd[i.nome]||(r.porProd[i.nome]={qtd:0,rec:0,custo:0});o.qtd+=i.qtd;o.rec+=rec;o.custo+=c;
      const k=i.cat||'—';const oc=r.porCat[k]||(r.porCat[k]={qtd:0,rec:0,custo:0});oc.qtd+=i.qtd;oc.rec+=rec;oc.custo+=c;
    }
    const d=dia(v.ts);r.porDia[d]=(r.porDia[d]||0)+v.total;
    const h=hora(v.ts);r.porHora[h]=(r.porHora[h]||0)+v.total;
  }
  r.ticket=r.n?r.total/r.n:0;return r;
}
function barras(dados,h){
  h=h||150;const w=Math.max(300,dados.length*46);const max=Math.max(1,...dados.map(d=>d.v));const bw=w/dados.length;
  return '<svg viewBox="0 0 '+w+' '+(h+30)+'" width="100%" style="max-height:'+(h+40)+'px">'+dados.map((d,i)=>{
    const bh=d.v/max*h;
    return '<rect x="'+(i*bw+6)+'" y="'+(h-bh+12)+'" width="'+(bw-12)+'" height="'+bh+'" rx="4" style="fill:var(--barra)"/>'
     +'<text x="'+(i*bw+bw/2)+'" y="'+(h+26)+'" font-size="11" text-anchor="middle" style="fill:var(--lbl)">'+esc(d.l)+'</text>'
     +(d.v?'<text x="'+(i*bw+bw/2)+'" y="'+(h-bh+8)+'" font-size="10" text-anchor="middle" style="fill:var(--txt)">'+Math.round(d.v)+'</text>':'');
  }).join('')+'</svg>';
}

function tDash(){
  const h=hoje(),mi=h.slice(0,8)+'01';
  const rh=resumo(vendasPeriodo(h,h)),rm=resumo(vendasPeriodo(mi,h));
  const dm=despPeriodo(mi,h).reduce((s,d)=>s+d.valor,0);
  const res=rm.total-rm.taxas-rm.cmv-dm;

  const top=Object.entries(rm.porProd).sort((a,b)=>b[1].rec-a[1].rec).slice(0,6);
  const baixos=db.insumos.filter(i=>i.estoque<=i.min);
  const pd=Math.min(100,rh.total/(db.params.metaDia||1)*100),pm=Math.min(100,rm.total/(db.params.metaMes||1)*100);

  +(vazio?'<div class="warn"><b>Bem-vindo!</b> Você ainda não cadastrou produtos. <button class="btn sm" onclick="exemplo()">Carregar exemplo de cardápio e estoque</button> ou cadastre o seu em <a style="color:var(--tit);cursor:pointer;text-decoration:underline" onclick="go(\'prod\')">Produtos</a>.</div>':'')
  +'<div class="kpis">'
  +'<div class="kpi"><small>Faturamento hoje</small><b>'+brl(rh.total)+'</b></div>'
  +'<div class="kpi"><small>Vendas hoje</small><b>'+rh.n+'</b></div>'
  +'<div class="kpi"><small>Ticket médio hoje</small><b>'+brl(rh.ticket)+'</b></div>'
  +'<div class="kpi"><small>Faturamento no mês</small><b>'+brl(rm.total)+'</b></div>'
  +'<div class="kpi '+(res>=0?'verde':'verm')+'"><small>Resultado estimado do mês</small><b>'+brl(res)+'</b></div></div>'
  +'<div class="cols"><div class="card"><h3>Metas</h3><div class="row sp"><span>Dia: '+brl(rh.total)+' / '+brl(db.params.metaDia)+'</span><b>'+pd.toFixed(0)+'%</b></div><div class="bar"><i style="width:'+pd+'%"></i></div>'
  +'<div class="row sp" style="margin-top:12px"><span>Mês: '+brl(rm.total)+' / '+brl(db.params.metaMes)+'</span><b>'+pm.toFixed(0)+'%</b></div><div class="bar"><i style="width:'+pm+'%"></i></div></div>'
  +'<div class="card"><h3>Hoje por forma de pagamento</h3><table>'+FORMAS.map(f=>'<tr><td>'+f.n+'</td><td class="n">'+brl(rh.porForma[f.k])+'</td></tr>').join('')+'</table></div></div>'
  +'<div class="cols"><div class="card"><h3>Últimos 7 dias</h3>'+barras(dias)+'</div><div class="card"><h3>Hoje por hora</h3>'+barras(horas)+'</div></div>'
  +'<div class="cols"><div class="card"><h3>Mais vendidos no mês</h3>'+(top.length?'<table>'+top.map(t=>'<tr><td>'+esc(t[0])+'</td><td class="n">'+num(t[1].qtd)+'</td><td class="n">'+brl(t[1].rec)+'</td></tr>').join('')+'</table>':'<p class="muted">Sem vendas no mês.</p>')+'</div>'
  +'<div class="card"><h3>Estoque baixo</h3>'+(baixos.length?'<table>'+baixos.map(i=>'<tr><td>'+esc(i.nome)+'</td><td class="n neg">'+num(i.estoque)+' '+esc(i.un)+'</td><td class="n muted">mín. '+num(i.min)+'</td></tr>').join('')+'</table>':'<p class="pos">Tudo em ordem ✔</p>')+'</div></div>';
}

/* ============ PDV ============ */
function cartTot(){
  const sub=r2(cart.reduce((s,i)=>s+i.qtd*i.preco,0));
  let d=descCart.tipo==='%'?sub*descCart.valor/100:descCart.valor;
  d=r2(Math.min(Math.max(d,0),sub));return{sub,d,total:r2(sub-d)};
}
function tPDV(){
  const cx=caixaAberto();
  if(!cx)return '<div class="card center"><h2>Caixa fechado</h2><p>Abra o caixa para registrar vendas.</p><button class="btn" onclick="abrirCaixa()">Abrir caixa</button></div>';
  const cats=['Todos'].concat(db.params.catProd);
  const prods=db.produtos.filter(p=>p.ativo!==false&&(catSel==='Todos'||p.cat===catSel));
  const t=cartTot();
  return '<div class="pdv"><div><div class="cats">'+cats.map(c=>'<span class="cat '+(c===catSel?'on':'')+'" onclick="catSel=\''+esc(c).replace(/'/g,"\\'")+'\';render()">'+esc(c)+'</span>').join('')+'</div>'
  +(prods.length?'<div class="pgrid">'+prods.map(p=>'<div class="pbtn" onclick="addCart(\''+p.id+'\')"><b>'+esc(p.nome)+'</b><span>'+brl(p.preco)+(p.porPeso?'/kg':'')+'</span></div>').join('')+'</div>':'<p class="muted" style="margin-top:20px">Nenhum produto. Cadastre em Produtos.</p>')+'</div>'
  +'<div class="cart"><h3>Venda atual</h3><div class="itens">'+(cart.length?cart.map((i,k)=>'<div class="it"><div style="flex:1"><b>'+esc(i.nome)+'</b><br><small class="muted">'+(i.peso?num(i.qtd*1000)+' g × '+brl(i.preco)+'/kg':brl(i.preco)+' un')+'</small></div>'
    +(i.peso?'':'<button class="qb" onclick="qtdCart('+k+',-1)">−</button><b>'+i.qtd+'</b><button class="qb" onclick="qtdCart('+k+',1)">+</button>')
    +'<b style="min-width:70px;text-align:right">'+brl(i.qtd*i.preco)+'</b><button class="qb" onclick="cart.splice('+k+',1);render()">✕</button></div>').join(''):'<p class="muted">Toque nos produtos para adicionar.</p>')+'</div>'
  +'<div class="row" style="margin-bottom:8px"><span>Desconto</span><select style="width:70px" onchange="descCart.tipo=this.value;render()"><option value="v" '+(descCart.tipo==='v'?'selected':'')+'>R$</option><option value="%" '+(descCart.tipo==='%'?'selected':'')+'>%</option></select><input style="width:90px" value="'+fin(descCart.valor)+'" onchange="descCart.valor=pn(this.value);render()"></div>'
  +'<div class="row sp muted"><span>Subtotal</span><span>'+brl(t.sub)+'</span></div>'+(t.d?'<div class="row sp muted"><span>Desconto</span><span>− '+brl(t.d)+'</span></div>':'')
  +'<div class="tot">'+brl(t.total)+'</div>'
  +'<div class="row" style="margin-top:10px"><button class="btn red" onclick="if(!cart.length||confirm(\'Limpar a venda?\')){cart=[];descCart={tipo:\'v\',valor:0};render()}">Limpar</button><button class="btn ok" style="flex:1;font-size:16px" '+(cart.length?'':'disabled')+' onclick="abrirPag()">Receber</button></div></div></div>';
}
function addCart(pid){
  const p=db.produtos.find(x=>x.id===pid);if(!p)return;
  if(p.porPeso){
    modal('<h3>'+esc(p.nome)+'</h3><label>Peso do prato (gramas)<input id="gr" inputmode="decimal" autofocus onkeydown="if(event.key===\'Enter\')okPeso(\''+pid+'\')"></label><p class="muted">Preço: '+brl(p.preco)+' por kg</p><div class="acts"><button class="btn gray" onclick="fechar()">Cancelar</button><button class="btn" onclick="okPeso(\''+pid+'\')">Adicionar</button></div>');
    setTimeout(()=>$('#gr')&&$('#gr').focus(),50);return;
  }
  const ex=cart.find(i=>i.pid===pid&&!i.peso);
  if(ex)ex.qtd++;else cart.push({pid:pid,nome:p.nome,cat:p.cat,qtd:1,preco:p.preco,custo:custoProd(p),peso:false});
  render();
}
function okPeso(pid){
  const g=pn($('#gr').value);if(g<=0)return;
  const p=db.produtos.find(x=>x.id===pid);
  cart.push({pid:pid,nome:p.nome,cat:p.cat,qtd:g/1000,preco:p.preco,custo:custoProd(p),peso:true});
  fechar();render();
}
function qtdCart(k,d){cart[k].qtd+=d;if(cart[k].qtd<=0)cart.splice(k,1);render()}
function abrirPag(){if(!cart.length)return;pags=[];modalPag()}
function modalPag(){
  const t=cartTot(),rec=r2(pags.reduce((s,p)=>s+p.valor,0)),falta=r2(t.total-rec),troco=rec>t.total?r2(rec-t.total):0;
  modal('<h3>Pagamento — '+brl(t.total)+'</h3>'
   +(pags.length?'<table>'+pags.map((p,i)=>'<tr><td>'+FN(p.forma)+'</td><td class="n">'+brl(p.valor)+'</td><td class="n"><button class="qb" onclick="pags.splice('+i+',1);modalPag()">✕</button></td></tr>').join('')+'</table>':'')
   +'<label style="margin-top:10px">Valor recebido<input id="pv" inputmode="decimal" value="'+(falta>0?fin(falta.toFixed(2)):'')+'"></label>'
   +'<div class="row">'+FORMAS.map(f=>'<button class="btn '+f.c+'" onclick="addPag(\''+f.k+'\')">'+f.n+'</button>').join('')+'</div>'
   +'<div class="row sp" style="margin-top:12px"><span>Recebido: <b>'+brl(rec)+'</b></span>'+(falta>0?'<span class="neg">Falta '+brl(falta)+'</span>':'<span class="pos">Troco: '+brl(troco)+'</span>')+'</div>'
   +'<div class="acts"><button class="btn gray" onclick="fechar()">Voltar</button><button class="btn ok" '+(falta>0?'disabled':'')+' onclick="finalizar()">Finalizar venda</button></div>');
  setTimeout(()=>{const e=$('#pv');if(e){e.focus();e.select()}},50);
}
function addPag(k){
  const t=cartTot(),rec=r2(pags.reduce((s,p)=>s+p.valor,0)),falta=r2(t.total-rec);
  let v=r2(pn($('#pv').value));if(v<=0||falta<=0)return;
  if(k!=='din'&&v>falta)v=falta;
  pags.push({forma:k,valor:v});modalPag();
}
function finalizar(){
  const cx=caixaAberto();if(!cx||!cart.length)return;
  const t=cartTot(),rec=r2(pags.reduce((s,p)=>s+p.valor,0));
  if(rec<t.total)return;
  const troco=r2(rec-t.total),din=r2(pags.filter(p=>p.forma==='din').reduce((s,p)=>s+p.valor,0));
  if(troco>din){alert('O troco só pode sair do valor pago em dinheiro.');return}
  const pf=pags.map(p=>({forma:p.forma,valor:p.valor}));
  let rest=troco;for(const p of pf){if(p.forma==='din'&&rest>0){const x=Math.min(p.valor,rest);p.valor=r2(p.valor-x);rest=r2(rest-x)}}
  const pfin=pf.filter(p=>p.valor>0);
  const taxas=r2(pfin.reduce((s,p)=>s+p.valor*taxaForma(p.forma)/100,0));
  const v={id:uid(),num:++db.seq,caixaId:cx.id,ts:Date.now(),itens:cart.map(i=>({pid:i.pid,nome:i.nome,cat:i.cat,qtd:i.qtd,preco:i.preco,custo:i.custo,peso:i.peso})),subtotal:t.sub,desconto:t.d,total:t.total,pags:pfin,troco:troco,taxas:taxas,status:'ok'};
  for(const i of v.itens){const p=db.produtos.find(x=>x.id===i.pid);if(p&&p.receita)for(const r of p.receita){const s=insumo(r.ins);if(s)s.estoque=r4(s.estoque-r.qtd*i.qtd)}}
  db.vendas.push(v);marcarMes(v.ts);save();cart=[];descCart={tipo:'v',valor:0};pags=[];
  modal('<h3>Venda #'+v.num+' registrada ✔</h3>'+(troco>0?'<p style="font-size:22px">Troco: <b class="pos">'+brl(troco)+'</b></p>':'')
   +'<div class="acts"><button class="btn gray" onclick="imprimir(reciboHTML(db.vendas.find(x=>x.id===\''+v.id+'\')))">🖨 Imprimir cupom</button><button class="btn" onclick="fechar();render()">Nova venda</button></div>');
  render();
}
function lin(a,b){return '<div style="display:flex;justify-content:space-between;gap:8px"><span>'+a+'</span><span>'+b+'</span></div>'}
function reciboHTML(v){
  const P=db.params;
  return '<div style="font-family:monospace;width:290px;font-size:12px"><div style="text-align:center"><b>'+esc(P.nome)+'</b><br>Venda nº '+v.num+'<br>'+fdata(v.ts)+'</div><hr>'
  +v.itens.map(i=>esc(i.nome)+lin('&nbsp;&nbsp;'+(i.peso?num(i.qtd*1000)+' g':num(i.qtd)+' x '+brl(i.preco)),brl(i.qtd*i.preco))).join('')+'<hr>'
  +lin('Subtotal',brl(v.subtotal))+(v.desconto?lin('Desconto','- '+brl(v.desconto)):'')+'<b>'+lin('TOTAL',brl(v.total))+'</b><hr>'
  +v.pags.map(p=>lin(FN(p.forma),brl(p.valor))).join('')+(v.troco?lin('Troco',brl(v.troco)):'')
  +'<hr><div style="text-align:center">'+esc(P.rodape)+'</div></div>';
}

/* ============ CAIXA ============ */
function abrirCaixa(){
  const ult=db.caixas.filter(c=>c.status==='fechado').slice(-1)[0];
  modal('<h3>Abrir caixa</h3><label>Operador<input id="op" value="'+esc(ult?ult.operador:'')+'"></label><label>Troco inicial (dinheiro na gaveta)<input id="ini" inputmode="decimal" value="0"></label><div class="acts"><button class="btn gray" onclick="fechar()">Cancelar</button><button class="btn ok" onclick="okAbrir()">Abrir</button></div>');
}
function okAbrir(){
  if(caixaAberto())return;
  db.caixas.push({id:uid(),ts:Date.now(),operador:$('#op').value.trim()||'—',inicial:r2(pn($('#ini').value)),status:'aberto'});
  save();fechar();render();
}
function resCaixa(id){
  const c=db.caixas.find(x=>x.id===id);
  const vs=db.vendas.filter(v=>v.caixaId===id&&v.status==='ok'),r=resumo(vs);
  const m=db.movs.filter(x=>x.caixaId===id);
  const sup=r2(m.filter(x=>x.tipo==='sup').reduce((s,x)=>s+x.valor,0)),san=r2(m.filter(x=>x.tipo==='san').reduce((s,x)=>s+x.valor,0));
  return{c:c,r:r,m:m,sup:sup,san:san,esperado:r2(c.inicial+r.porForma.din+sup-san),canc:db.vendas.filter(v=>v.caixaId===id&&v.status!=='ok').length};
}
function tCaixa(){
  const cx=caixaAberto();let h='<h2>Caixa</h2>';
  if(cx){
    const x=resCaixa(cx.id);
    h+='<div class="card"><div class="row sp"><div><b>Caixa aberto</b> por '+esc(cx.operador)+' em '+fdata(cx.ts)+'</div><div class="row"><button class="btn am" onclick="mov(\'sup\')">+ Suprimento</button><button class="btn red" onclick="mov(\'san\')">− Sangria</button><button class="btn" onclick="modalFechar()">Fechar caixa</button></div></div></div>'
    +'<div class="kpis"><div class="kpi"><small>Troco inicial</small><b>'+brl(cx.inicial)+'</b></div><div class="kpi"><small>Vendas ('+x.r.n+')</small><b>'+brl(x.r.total)+'</b></div><div class="kpi"><small>Suprimentos / Sangrias</small><b>'+brl(x.sup)+' / '+brl(x.san)+'</b></div><div class="kpi verde"><small>Dinheiro esperado na gaveta</small><b>'+brl(x.esperado)+'</b></div></div>'
    +'<div class="cols"><div class="card"><h3>Vendas por forma</h3><table>'+FORMAS.map(f=>'<tr><td>'+f.n+'</td><td class="n">'+brl(x.r.porForma[f.k])+'</td></tr>').join('')+'</table></div>'
    +'<div class="card"><h3>Movimentações</h3>'+(x.m.length?'<table>'+x.m.map(m=>'<tr><td>'+fdata(m.ts)+'</td><td>'+(m.tipo==='sup'?'Suprimento':'Sangria')+'</td><td>'+esc(m.motivo)+'</td><td class="n">'+brl(m.valor)+'</td></tr>').join('')+'</table>':'<p class="muted">Nenhuma.</p>')+'</div></div>';
  }else h+='<div class="card center"><p>O caixa está fechado.</p><button class="btn ok" onclick="abrirCaixa()">Abrir caixa</button></div>';
  const hist=db.caixas.filter(c=>c.status==='fechado').slice().reverse();

   +hist.map(c=>'<tr><td>'+fdata(c.ts)+'</td><td>'+fdata(c.fim)+'</td><td>'+esc(c.operador)+'</td><td class="n">'+brl(c.vendasTotal)+'</td><td class="n">'+brl(c.esperado)+'</td><td class="n">'+brl(c.contado)+'</td><td class="n '+(c.diferenca<0?'neg':c.diferenca>0?'pos':'')+'">'+brl(c.diferenca)+'</td><td class="n"><button class="btn sm" onclick="verFech(\''+c.id+'\')">Ver</button></td></tr>').join('')+'</table>':'<p class="muted">Nenhum caixa fechado ainda.</p>')+'</div>';
  return h;

function modalFechar(){

function difF(esp){const d=r2(pn($('#ct').value)-esp);$('#dif').innerHTML='<span>Diferença</span><b class="'+(d<0?'neg':d>0?'pos':'')+'">'+brl(d)+'</b>'}

function saveCompra(){
  const its=cmpTmp.filter(r=>r.qtd>0&&r.total>0);if(!its.length){alert('Informe ao menos um item com quantidade e valor.');return}
  const itens=[];
  for(const r of its){
    const s=insumo(r.ins),base=Math.max(0,s.estoque);
    s.custo=r4((base*s.custo+r.total)/(base+r.qtd));  // custo médio ponderado
    s.estoque=r4(s.estoque+r.qtd);
    itens.push({ins:r.ins,nome:s.nome,qtd:r.qtd,total:r2(r.total)});
  }
  db.compras.push({id:uid(),data:$('#c_data').value||hoje(),fornecedor:$('#c_forn').value.trim()||'—',pagto:$('#c_pg').value,itens:itens,total:r2(itens.reduce((s,i)=>s+i.total,0))});
  save();fechar();render();
}

  const c=db.compras.find(x=>x.id===id);
  if(!confirm('Excluir esta compra? A quantidade comprada será retirada do estoque (o custo médio não é recalculado).'))return;
  for(const i of c.itens){const s=insumo(i.ins);if(s)s.estoque=r4(s.estoque-i.qtd)}

}

  if(rel.p==='mes')return[t.slice(0,8)+'01',t];
  if(rel.p==='ano')return[t.slice(0,4)+'-01-01',t];
  if(rel.p==='12m'||rel.p==='24m'){const d=new Date();d.setFullYear(d.getFullYear()-(rel.p==='12m'?1:2));d.setDate(d.getDate()+1);return[dia(d.getTime()),t]}
  if(rel.p==='mesAnt'){const a=new Date(h.getFullYear(),h.getMonth()-1,1),b=new Date(h.getFullYear(),h.getMonth(),0);return[dia(a.getTime()),dia(b.getTime())]}

}

  +'<div class="card"><h3>Formas de pagamento</h3><table>'+FORMAS.map(f=>'<tr><td>'+f.n+'</td><td class="n">'+brl(r.porForma[f.k])+'</td><td class="n muted">'+(r.total?(r.porForma[f.k]/r.total*100).toFixed(0):0)+'%</td></tr>').join('')+'</table>'
  +'<h3 style="margin-top:14px">Categorias</h3><table>'+Object.entries(r.porCat).sort((x,y)=>y[1].rec-x[1].rec).map(e=>'<tr><td>'+esc(e[0])+'</td><td class="n">'+brl(e[1].rec)+'</td></tr>').join('')+'</table></div></div>'
  +'<div class="card"><h3>Vendas por '+(porMes?'mês':'dia')+'</h3>'+barras(serie)+'</div>'
  +'<div class="card"><h3>Vendas por hora</h3>'+barras(horas)+'</div>'
  +'<div class="card"><h3>Produtos</h3>'+(prods.length?'<table><tr><th>Produto</th><th class="n">Qtd</th><th class="n">Receita</th><th class="n">Custo</th><th class="n">Lucro</th><th class="n">Margem</th></tr>'+prods.map(p=>{const l=p[1].rec-p[1].custo;return '<tr><td>'+esc(p[0])+'</td><td class="n">'+num(p[1].qtd)+'</td><td class="n">'+brl(p[1].rec)+'</td><td class="n">'+brl(p[1].custo)+'</td><td class="n">'+brl(l)+'</td><td class="n">'+(p[1].rec?(l/p[1].rec*100).toFixed(0):0)+'%</td></tr>'}).join('')+'</table>':'<p class="muted">Sem vendas.</p>')+'</div>'
  +(cxs.length?'<div class="card"><h3>Fechamentos de caixa</h3><table><tr><th>Data</th><th>Operador</th><th class="n">Esperado</th><th class="n">Contado</th><th class="n">Diferença</th></tr>'+cxs.map(c=>'<tr><td>'+fdata(c.ts)+'</td><td>'+esc(c.operador)+'</td><td class="n">'+brl(c.esperado)+'</td><td class="n">'+brl(c.contado)+'</td><td class="n '+(c.diferenca<0?'neg':c.diferenca>0?'pos':'')+'">'+brl(c.diferenca)+'</td></tr>').join('')+'</table></div>':'');
  window._relBody=body;
  return '<h2>Relatórios</h2><div class="card"><div class="row"><select style="width:auto" onchange="rel.p=this.value;render()">'+[['hoje','Hoje'],['7d','Últimos 7 dias'],['mes','Este mês'],['mesAnt','Mês passado'],['ano','Este ano'],['12m','Últimos 12 meses'],['24m','Últimos 24 meses'],['custom','Período livre']].map(o=>'<option value="'+o[0]+'" '+(rel.p===o[0]?'selected':'')+'>'+o[1]+'</option>').join('')+'</select>'
  +(rel.p==='custom'?'<input type="date" style="width:auto" value="'+a+'" onchange="rel.a=this.value;render()"><input type="date" style="width:auto" value="'+b+'" onchange="rel.b=this.value;render()">':'')
  +'<div style="flex:1"></div><button class="btn gray" onclick="imprimir(window._relBody)">🖨 Imprimir</button><button class="btn gray" onclick="expVendas()">⬇ Vendas (Excel/CSV)</button><button class="btn gray" onclick="expProd()">⬇ Produtos (CSV)</button></div></div><div id="relBody">'+body+'</div>';
}
function expVendas(){
  const[a,b]=rangeRel(),L=[['Nº','Data','Hora','Itens','Pagamento','Subtotal','Desconto','Total','Taxas','Status']];
  vendasEntre(a,b).forEach(v=>L.push([v.num,fdia(dia(v.ts)),hora(v.ts)+':'+pad(new Date(v.ts).getMinutes()),v.itens.map(i=>i.nome).join(' + '),v.pags.map(p=>FN(p.forma)+' '+fcsv(p.valor)).join(' + '),fcsv(v.subtotal),fcsv(v.desconto),fcsv(v.total),fcsv(v.taxas||0),v.status]));
  baixar('vendas_'+a+'_a_'+b+'.csv',csv(L),'text/csv');
}
function expProd(){
  const[a,b]=rangeRel(),r=resumo(vendasPeriodo(a,b)),L=[['Produto','Quantidade','Receita','Custo','Lucro']];
  Object.entries(r.porProd).forEach(([n,p])=>L.push([n,fcsv(r4(p.qtd)),fcsv(r2(p.rec)),fcsv(r2(p.custo)),fcsv(r2(p.rec-p.custo))]));
  baixar('produtos_'+a+'_a_'+b+'.csv',csv(L),'text/csv');
}

/* ============ PARÂMETROS / BACKUP ============ */
function tPar(){
  const P=db.params,bk=P.lastBackup?new Date(P.lastBackup).toLocaleString('pt-BR'):'nunca';
  return '<h2>Parâmetros</h2><div class="cols"><div class="card"><h3>Negócio</h3><label>Nome da açaiteria<input id="s_nome" value="'+esc(P.nome)+'"></label><label>Rodapé do cupom<input id="s_rod" value="'+esc(P.rodape)+'"></label>'
  +'<label>PIN do gerente (pedido ao cancelar venda e fazer sangria; deixe vazio para desativar)<input id="s_pin" value="'+esc(P.pin)+'"></label></div>'
  +'<div class="card"><h3>Taxas e metas</h3><div class="grid2"><label>Taxa cartão débito (%)<input id="s_td" inputmode="decimal" value="'+fin(P.taxaDebito)+'"></label><label>Taxa cartão crédito (%)<input id="s_tc" inputmode="decimal" value="'+fin(P.taxaCredito)+'"></label><label>Taxa Pix (%)<input id="s_tp" inputmode="decimal" value="'+fin(P.taxaPix)+'"></label><label>Estoque mínimo padrão<input id="s_em" inputmode="decimal" value="'+fin(P.estoqueMin)+'"></label><label>Meta de faturamento diária (R$)<input id="s_md" inputmode="decimal" value="'+fin(P.metaDia)+'"></label><label>Meta mensal (R$)<input id="s_mm" inputmode="decimal" value="'+fin(P.metaMes)+'"></label></div></div></div>'
  +'<div class="card"><h3>Categorias</h3><div class="grid2"><label>Categorias de produtos (separe por vírgula)<input id="s_cp" value="'+esc(P.catProd.join(', '))+'"></label><label>Categorias de despesas (separe por vírgula)<input id="s_cd" value="'+esc(P.catDesp.join(', '))+'"></label></div><button class="btn" onclick="savePar()">Salvar parâmetros</button></div>'
  +'<div class="card"><h3>Backup dos dados</h3>'+'<p>Seus dados ficam guardados <b>dentro do iPad</b>. Mesmo assim, faça uma cópia de segurança <b>toda semana</b> (e depois de fechar o caixa): toque em <b>Fazer backup agora</b> e escolha <b>Salvar em Arquivos</b> (iCloud Drive), AirDrop ou envie para o seu e-mail/WhatsApp. Se o iPad for trocado, apagado ou perdido, é o backup que recupera tudo. Último backup: <b>'+bk+'</b>.</p><div class="row"><button class="btn ok" onclick="backup()">⬇ Fazer backup agora</button><button class="btn gray" onclick="$(\'#imp\').click()">⬆ Restaurar backup</button><input type="file" id="imp" accept=".json" style="display:none" onchange="restaurar(this.files[0])"><button class="btn red" onclick="zerar()">Apagar tudo</button></div></div>'+armazCard();
}
function armazCard(){
  const n=db.vendas.length,a=n?fdia(dia(db.vendas[0].ts)):'—',z=n?fdia(dia(db.vendas[n-1].ts)):'—';
  setTimeout(()=>{const e=$('#armz');if(!e||!(navigator.storage&&navigator.storage.estimate))return;navigator.storage.estimate().then(r=>{const f=x=>x>1048576?(x/1048576).toFixed(1)+' MB':Math.round(x/1024)+' KB';e.textContent='Ocupa '+f(r.usage||0)+' de ~'+f(r.quota||0)+' disponíveis.'+(persistido?' Armazenamento protegido ✔':'')}).catch(()=>{})},50);
  return '<div class="card"><h3>Armazenamento neste iPad</h3><p>Vendas guardadas: <b>'+n.toLocaleString('pt-BR')+'</b> ('+a+' a '+z+'). O sistema aguenta anos de histórico sem ficar lento.</p><p class="muted" id="armz">Calculando…</p></div>';
}
function savePar(){
  const P=db.params,L=s=>s.split(',').map(x=>x.trim()).filter(Boolean);
  P.nome=$('#s_nome').value.trim()||'Minha Açaiteria';P.rodape=$('#s_rod').value;P.pin=$('#s_pin').value.trim();
  P.taxaDebito=pn($('#s_td').value);P.taxaCredito=pn($('#s_tc').value);P.taxaPix=pn($('#s_tp').value);P.estoqueMin=pn($('#s_em').value);P.metaDia=pn($('#s_md').value);P.metaMes=pn($('#s_mm').value);
  const cp=L($('#s_cp').value),cd=L($('#s_cd').value);if(cp.length)P.catProd=cp;if(cd.length)P.catDesp=cd;
  save();render();alert('Parâmetros salvos.');
}
async function backup(){
  const ant=db.params.lastBackup;db.params.lastBackup=Date.now();
  const ok=await baixar('backup_acaiteria_'+hoje()+'.json',JSON.stringify(db),'application/json');
  if(ok)save();else db.params.lastBackup=ant;
  render();
}
function restaurar(f){
  if(!f)return;const rd=new FileReader();
  rd.onload=()=>{try{const d=JSON.parse(rd.result);if(!d.params||!d.vendas)throw 0;if(!confirm('Isso substitui TODOS os dados atuais pelos do backup. Continuar?'))return;d.vendas.sort((x,y)=>x.ts-y.ts);db=d;normalizar();save(true);render();alert('Backup restaurado.')}catch(e){alert('Arquivo de backup inválido.')}};
  rd.readAsText(f);
}
function zerar(){if(confirm('Apagar TODOS os dados? Faça um backup antes!')&&confirm('Tem certeza? Esta ação não pode ser desfeita.')){db=DEF();normalizar();save(true);render()}}

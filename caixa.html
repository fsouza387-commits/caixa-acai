<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Caixa Açaiteria</title>

<meta name="theme-color" content="#f4f1f8">
<script>try{if(localStorage.getItem('acai_tema')==='escuro')document.documentElement.dataset.tema='escuro';var c=JSON.parse(localStorage.getItem('acai_cores')||'null');if(c&&window.__pre)window.__pre(c)}catch(e){}</script>
<style>
:root{
--accent:#6a2c91;--accent2:#ff7ab8;--onacc:#fff;
--roxo:#4b1d6e;--roxo2:#6a2c91;--lil:#f3eaf9;--tit:#4b1d6e;--hov:#f3eaf9;--barra:#6a2c91;
--verde:#1f9d55;--verm:#d64545;--am:#e69500;--cinza:#6b6b7b;
--txt:#1d1d1f;--lbl:#5c5c66;--bg:#f4f1f8;
--card:rgba(255,255,255,.8);--glass:rgba(255,255,255,.66);--glassbd:rgba(255,255,255,.75);--sheet:rgba(255,255,255,.9);
--bd:rgba(60,40,90,.12);--bd2:rgba(60,40,90,.08);--inp:rgba(120,120,128,.12);--inpbd:rgba(120,120,128,.3);--trk:rgba(120,120,128,.28);
--sombra:rgba(25,12,45,.38);--glow1:rgba(106,44,145,.16);--glow2:rgba(255,122,184,.16);
--tgbg:#dff5e8;--tgc:#157a42;--trbg:#fde3e3;--trc:#b02a2a;--tybg:#fff0d1;--tyc:#9a6200;--wbg:#fff3d6;--wbd:#f0cf80;
color-scheme:light}
:root[data-tema=escuro]{
--roxo2:#8a45b8;--lil:#2e2240;--hov:#33264a;--tit:#d9b3f5;--barra:#a863dc;
--bg:#0d0a14;--card:rgba(42,35,56,.72);--glass:rgba(34,29,46,.62);--glassbd:rgba(255,255,255,.12);--sheet:rgba(38,32,52,.92);
--txt:#f5f2fa;--lbl:#bdb3cb;--cinza:#a99fb8;--bd:rgba(255,255,255,.12);--bd2:rgba(255,255,255,.08);--inp:rgba(255,255,255,.1);--inpbd:rgba(255,255,255,.22);--trk:rgba(255,255,255,.22);
--sombra:rgba(0,0,0,.62);--glow1:rgba(138,69,184,.28);--glow2:rgba(255,122,184,.2);
--tgbg:#14392a;--tgc:#6fdca0;--trbg:#4a1f24;--trc:#ff9a9a;--tybg:#43330f;--tyc:#f5c96a;--wbg:#3b3012;--wbd:#6b5518;--verde:#34c16f;--verm:#ff6b6b;color-scheme:dark}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
:root{--glass:rgba(255,255,255,.97);--sheet:#fff}:root[data-tema=escuro]{--glass:#241e30;--sheet:#241e30}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
html,body{overscroll-behavior:none}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Inter","Helvetica Neue","Segoe UI",system-ui,Arial,sans-serif;font-weight:400;background:var(--bg);color:var(--txt);font-size:15px;line-height:1.35;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden;padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
body::before{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(60vw 50vh at 8% -8%,var(--glow1),transparent 62%),radial-gradient(55vw 46vh at 96% 4%,var(--glow2),transparent 62%),radial-gradient(70vw 55vh at 55% 112%,var(--glow1),transparent 62%)}
button,.btn,.pbtn,.cat,.dk,.qb,.ib,select,.mtile{touch-action:manipulation}
button{font-family:inherit}
#wrap{flex:1;display:flex;flex-direction:column;min-height:0}
/* cabeçalho em vidro */
#top{margin:10px 14px 0;padding:10px 14px;border-radius:24px;background:var(--glass);-webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%);border:1px solid var(--glassbd);box-shadow:0 8px 30px rgba(40,20,70,.07);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.brand .lg{width:40px;height:40px;border-radius:12px;overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:var(--card)}
.brand .lg img{width:100%;height:100%;object-fit:cover}.brand .lg svg{width:100%;height:100%}
.brand b{display:block;font-weight:600;font-size:16px;letter-spacing:-.01em;line-height:1.15}.brand small{display:block;font-size:12px}
.iconbtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--glassbd);background:var(--card);cursor:pointer;font-size:17px;line-height:1;display:inline-flex;align-items:center;justify-content:center;color:var(--txt)}
.iconbtn:active{transform:scale(.92)}
#main{flex:1;overflow:auto;padding:12px 18px calc(124px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch;scrollbar-width:thin}
#main.enter>*{animation:enter .3s cubic-bezier(.2,.8,.3,1) both}
@keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
/* barra de ícones flutuante (estilo iOS) */
#dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));z-index:40;max-width:calc(100vw - 20px);display:flex;gap:2px;padding:7px;border-radius:36px;background:var(--glass);-webkit-backdrop-filter:blur(30px) saturate(200%);backdrop-filter:blur(30px) saturate(200%);border:1px solid var(--glassbd);box-shadow:0 18px 50px rgba(30,10,60,.26),inset 0 1px 0 rgba(255,255,255,.5);overflow-x:auto;scrollbar-width:none}
#dock::-webkit-scrollbar{display:none}
.dk{flex:0 0 auto;width:66px;border:0;background:transparent;color:var(--lbl);display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px 7px;border-radius:28px;cursor:pointer;font-size:10.5px;font-weight:500;letter-spacing:.01em;transition:background .22s,color .22s,transform .15s,box-shadow .22s}
.dk svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.dk:active{transform:scale(.9)}
.dk.on{background:var(--accent);color:var(--onacc);box-shadow:0 8px 20px var(--glow1)}
/* tipografia */
h2{margin:2px 0 14px;font-size:32px;font-weight:600;letter-spacing:-.03em;color:var(--txt)}
h3{margin:0 0 10px;font-size:18px;font-weight:600;letter-spacing:-.015em;color:var(--txt)}
h4{margin:14px 0 6px;font-size:15px;font-weight:600}
/* cartões */
.card{background:var(--card);border:1px solid var(--glassbd);border-radius:26px;padding:18px;margin-bottom:14px;box-shadow:0 6px 24px rgba(40,20,70,.06)}
.center{text-align:center;padding:44px 20px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--glassbd);border-radius:26px;padding:15px 17px;box-shadow:0 6px 24px rgba(40,20,70,.06)}
.kpi small{color:var(--cinza);display:block;font-weight:500}.kpi b{font-size:24px;font-weight:600;letter-spacing:-.02em;color:var(--txt)}
.kpis .kpi:first-child{background:linear-gradient(135deg,var(--accent) 0%,var(--accent2) 160%);border-color:transparent;box-shadow:0 14px 34px var(--glow1)}
.kpis .kpi:first-child small{color:rgba(255,255,255,.88)}.kpis .kpi:first-child b{color:#fff}
.kpi.verm b{color:var(--verm)}.kpi.verde b{color:var(--verde)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row.sp{justify-content:space-between}
/* botões em pílula */
.btn{background:var(--accent);color:var(--onacc);border:0;border-radius:999px;padding:11px 20px;cursor:pointer;font-size:15px;font-weight:500;letter-spacing:-.005em;transition:filter .15s,transform .12s}
.btn:hover{filter:brightness(1.08)}.btn:active{transform:scale(.96)}
.btn.ok{background:var(--verde);color:#fff}.btn.red{background:var(--verm);color:#fff}.btn.am{background:var(--am);color:#fff}
.btn.gray{background:var(--inp);color:var(--txt)}
.btn.sm{padding:7px 14px;font-size:13px}.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
/* tabelas */
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;background:transparent;color:var(--cinza);padding:8px;font-size:11.5px;font-weight:500;text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--bd);position:sticky;top:0}
td{padding:11px 8px;border-bottom:1px solid var(--bd2);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right}
/* campos */
input,select,textarea{padding:11px 13px;border:1px solid transparent;border-radius:13px;font-size:16px;width:100%;background:var(--inp);color:var(--txt);font-family:inherit;transition:box-shadow .15s,border-color .15s;min-height:44px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--glow1)}
input::placeholder{color:var(--cinza)}
option{background:var(--sheet);color:var(--txt)}
input[type=checkbox],input[type=radio]{accent-color:var(--accent);min-height:0}
input[type=color]{width:64px;height:44px;padding:3px;cursor:pointer}
label{display:block;font-size:13px;font-weight:400;color:var(--lbl);margin-bottom:9px}
label.chk{display:flex;gap:10px;align-items:center;color:var(--txt);font-size:15px}label.chk input{width:22px;height:22px}
.tag{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:500}
.tag.g{background:var(--tgbg);color:var(--tgc)}.tag.r{background:var(--trbg);color:var(--trc)}.tag.y{background:var(--tybg);color:var(--tyc)}.tag.p{background:var(--lil);color:var(--tit)}
/* PDV */
.pdv{display:grid;grid-template-columns:1fr 360px;gap:14px;align-items:start}
.cats{display:flex;gap:7px;flex-wrap:wrap}
.cat{padding:9px 17px;border-radius:999px;background:var(--card);border:1px solid var(--glassbd);cursor:pointer;font-weight:500;font-size:14px;color:var(--txt)}
.cat.on{background:var(--accent);color:var(--onacc);border-color:transparent;box-shadow:0 6px 16px var(--glow1)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:12px}
.pbtn{background:var(--card);border:1px solid var(--glassbd);border-radius:24px;padding:14px 10px;cursor:pointer;text-align:center;min-height:100px;display:flex;flex-direction:column;justify-content:center;align-items:center;box-shadow:0 6px 20px rgba(40,20,70,.06);transition:transform .15s,box-shadow .15s;color:var(--txt)}
.pbtn:hover{transform:translateY(-2px);box-shadow:0 12px 28px var(--glow1)}.pbtn:active{transform:scale(.96)}
.pbtn b{display:block;margin-bottom:6px;font-weight:500;letter-spacing:-.01em}
.pbtn span{background:var(--lil);color:var(--tit);border-radius:999px;padding:3px 11px;font-weight:600;font-size:14px}
.pbtn small{margin-top:5px;font-size:11.5px}
.cart{background:var(--card);border:1px solid var(--glassbd);border-radius:28px;padding:16px;display:flex;flex-direction:column;position:sticky;top:0;max-height:calc(100vh - 250px);max-height:calc(100dvh - 250px);box-shadow:0 10px 34px rgba(40,20,70,.09)}
.cart .itens{flex:1;overflow:auto;margin:8px 0}
.cart .it{display:flex;justify-content:space-between;gap:6px;padding:9px 0;border-bottom:1px dashed var(--bd);align-items:center}
.cart .tot{font-size:30px;font-weight:600;letter-spacing:-.02em;color:var(--tit);text-align:right}
.qb{border:1px solid var(--bd);background:var(--inp);border-radius:50%;width:34px;height:34px;cursor:pointer;color:var(--txt);font-size:15px;line-height:1;display:inline-flex;align-items:center;justify-content:center}
.qb:active{transform:scale(.9)}
/* janelas (sheets) */
#modal{display:none;position:fixed;inset:0;background:var(--sombra);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);align-items:center;justify-content:center;z-index:60;padding:14px}
.mbox{background:var(--sheet);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);border:1px solid var(--glassbd);border-radius:32px;padding:22px;width:480px;max-width:100%;max-height:92vh;max-height:92dvh;overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.35);animation:sheet .3s cubic-bezier(.2,.9,.3,1);color:var(--txt)}
.mbox.wide{width:740px}
@keyframes sheet{from{transform:translateY(30px) scale(.97);opacity:0}to{transform:none;opacity:1}}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.bar{height:11px;background:var(--trk);border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:8px}
.warn{background:var(--wbg);border:1px solid var(--wbd);border-radius:16px;padding:11px 15px;margin-bottom:12px}
.muted{color:var(--cinza)}.pos{color:var(--verde);font-weight:500}.neg{color:var(--verm);font-weight:500}
#printArea{display:none}
/* ajuda (i) */
.ib{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:var(--accent);color:var(--onacc);font:italic 700 12px Georgia,serif;margin-left:7px;cursor:pointer;vertical-align:middle;user-select:none;flex-shrink:0;line-height:1;text-transform:none;letter-spacing:0;opacity:.92}
.ib:hover,.ib:focus{outline:2px solid var(--am);outline-offset:1px}
#pop{position:fixed;z-index:90;max-width:330px;background:var(--sheet);-webkit-backdrop-filter:blur(26px);backdrop-filter:blur(26px);color:var(--txt);border:1px solid var(--accent);border-radius:18px;padding:12px 15px;box-shadow:0 14px 40px rgba(0,0,0,.3);font-size:13.5px;line-height:1.5;display:none;font-weight:400;text-align:left}
#pop b{display:block;color:var(--tit);margin-bottom:4px;font-size:14px}
/* chave liga/desliga (iOS) */
.sw{cursor:pointer;position:relative}.sw input{position:absolute;opacity:0;width:0;height:0;min-height:0}
.sw .trk{width:51px;height:31px;border-radius:16px;background:var(--trk);position:relative;flex-shrink:0;transition:background .2s}
.sw .trk::after{content:'';position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.sw input:checked+.trk{background:var(--verde)}.sw input:checked+.trk::after{left:22px}
.sw input:focus-visible+.trk{outline:2px solid var(--am);outline-offset:2px}
/* montagem */
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:9px}
.mtile{border:2px solid var(--bd);border-radius:20px;padding:13px 10px;cursor:pointer;text-align:center;position:relative;user-select:none;min-height:66px;background:var(--card)}
.mtile:hover{border-color:var(--accent)}.mtile.on{border-color:var(--verde);background:var(--hov)}.mtile.on::after{content:'✓';position:absolute;top:5px;right:11px;color:var(--verde);font-weight:700}
.mop{display:flex;align-items:center;gap:8px;border:1px solid var(--bd);border-radius:14px;padding:8px 10px}
/* aparência */
.lgprev{width:64px;height:64px;border-radius:18px;overflow:hidden;background:var(--card);border:1px solid var(--bd);display:inline-flex;flex-shrink:0}
.lgprev img,.lgprev svg{width:100%;height:100%;object-fit:cover}
.sws{display:flex;gap:9px;flex-wrap:wrap;margin:2px 0 12px}
.swc{width:34px;height:34px;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 1.5px var(--bd);cursor:pointer;padding:0;min-height:0}
.swc.on{box-shadow:0 0 0 3px var(--accent)}
@media(max-width:860px){.pdv{grid-template-columns:1fr 310px}.cols{grid-template-columns:1fr}h2{font-size:30px}}
@media(max-width:640px){.pdv{grid-template-columns:1fr}.cart{position:static;max-height:none}#modal{align-items:flex-end;padding:8px}.mbox{border-radius:30px}.grid2{grid-template-columns:1fr}}
@media(pointer:coarse){.btn{padding:13px 20px}.btn.sm{padding:10px 15px}.qb{width:38px;height:38px}td{padding:13px 8px}}
@media print{body{display:block;height:auto;overflow:visible;padding:0}body::before{display:none}body>*:not(#printArea){display:none!important}#printArea{display:block;color:#000;background:#fff}.ib,#pop{display:none!important}}

b,strong,th,.kpi b{font-synthesis:none}b,strong{font-weight:600}
</style>
</head>
<body>
<div id="wrap"><header id="top"></header><main id="main"></main></div>
<nav id="dock" aria-label="Menu"></nav>
<div id="modal"></div>
<div id="pop"></div>
<div id="printArea"></div>

<script>
/* ============ utilidades ============ */
const KEY='acai_caixa_v1';
const $=s=>document.querySelector(s);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const r2=n=>Math.round((n+Number.EPSILON)*100)/100;
const r4=n=>Math.round(n*10000)/10000;
const brl=n=>(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const num=n=>(n||0).toLocaleString('pt-BR',{maximumFractionDigits:3});
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const dia=ts=>{const d=new Date(ts);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const hoje=()=>dia(Date.now());
const hora=ts=>pad(new Date(ts).getHours());
const fdata=ts=>new Date(ts).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'});
const fdia=d=>d.split('-').reverse().join('/');
const pn=v=>{v=String(v==null?'':v).trim();if(v.includes(','))v=v.replace(/\./g,'').replace(',','.');return parseFloat(v)||0};
const fin=n=>String(n==null?0:n).replace('.',',');
const FORMAS=[{k:'din',n:'Dinheiro',c:'ok'},{k:'pix',n:'Pix',c:''},{k:'deb',n:'Cartão Débito',c:'am'},{k:'cre',n:'Cartão Crédito',c:'am'}];
const FN=k=>(FORMAS.find(f=>f.k===k)||{n:k}).n;

/* ============ dados ============ */
const DEF=()=>({v:1,params:{nome:'Minha Açaiteria',taxaDebito:1.5,taxaCredito:3.5,taxaPix:0,metaDia:1000,metaMes:25000,estoqueMin:5,pin:'',rodape:'Obrigado pela preferência!',catProd:['Açaí','Adicionais','Bebidas','Outros'],catDesp:['Aluguel','Energia','Água','Funcionários','Marketing','Embalagens','Internet','Outros'],lastBackup:0,tema:'claro',cor:'#6a2c91',cor2:'#ff7ab8',logo:''},produtos:[],insumos:[],complementos:[],compras:[],despesas:[],caixas:[],movs:[],vendas:[],ajustes:[],seq:0});
let db,modoServidor=false,svOk=true,fila=Promise.resolve(),pend=0;
function aplicarTema(){document.documentElement.dataset.tema=(db&&db.params&&db.params.tema)==='escuro'?'escuro':'claro';if(db)aplicarCores()}
/* ===== cores e logomarca ===== */
function hex2hsl(h){h=(h||'#6a2c91').replace('#','');if(h.length===3)h=h.replace(/./g,'$&$&');const r=parseInt(h.slice(0,2),16)/255,g=parseInt(h.slice(2,4),16)/255,b=parseInt(h.slice(4,6),16)/255,mx=Math.max(r,g,b),mn=Math.min(r,g,b);let H=0,S=0,L=(mx+mn)/2;if(mx!==mn){const d=mx-mn;S=L>.5?d/(2-mx-mn):d/(mx+mn);H=mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4;H*=60}return[H||0,S*100,L*100]}
function hex2rgb(h){h=(h||'#000000').replace('#','');if(h.length===3)h=h.replace(/./g,'$&$&');return[parseInt(h.slice(0,2),16)||0,parseInt(h.slice(2,4),16)||0,parseInt(h.slice(4,6),16)||0]}
function aplicarCores(){
  const P=(db&&db.params)||{},c1=/^#[0-9a-f]{6}$/i.test(P.cor||'')?P.cor:'#6a2c91',c2=/^#[0-9a-f]{6}$/i.test(P.cor2||'')?P.cor2:'#ff7ab8',st=document.documentElement.style,esc_=document.documentElement.dataset.tema==='escuro';
  const [h,sa]=hex2hsl(c1),[r,g,b]=hex2rgb(c1),lum=(0.299*r+0.587*g+0.114*b)/255;
  let acc=c1;if(esc_){const l=hex2hsl(c1)[2];if(l<48)acc='hsl('+h.toFixed(0)+','+Math.min(sa,85).toFixed(0)+'%,58%)'}
  st.setProperty('--accent',acc);st.setProperty('--accent2',c2);st.setProperty('--onacc',(esc_&&acc!==c1)||lum<.62?'#fff':'#1d1d1f');
  st.setProperty('--roxo2',acc);st.setProperty('--barra',acc);
  const S=Math.min(sa,70).toFixed(0);
  st.setProperty('--tit',esc_?'hsl('+h.toFixed(0)+','+S+'%,82%)':'hsl('+h.toFixed(0)+','+S+'%,24%)');
  st.setProperty('--lil',esc_?'hsl('+h.toFixed(0)+','+Math.min(S,40)+'%,18%)':'hsl('+h.toFixed(0)+','+S+'%,95%)');

function normalizar(){
  const d=DEF();db.params=Object.assign({},d.params,db.params);
  for(const k of Object.keys(d))if(db[k]===undefined)db[k]=d[k];
  aplicarTema();
}
function load(){
  try{const s=localStorage.getItem(KEY);db=s?JSON.parse(s):DEF()}catch(e){db=DEF()}
  normalizar();
}
function tagSave(){
  const e=$('#svt');if(!e)return;
  e.className='tag '+(svOk?'g':'r');
  e.textContent=svOk?(pend?'Salvando…':'💾 Salvo no disco'):'⚠ NÃO SALVO — servidor parado?';
}
function save(){
  if(!modoServidor){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){alert('Erro ao salvar os dados: '+e.message)}return}
  const body=JSON.stringify(db);pend++;tagSave();
  fila=fila.then(()=>fetch('/api/db',{method:'POST',headers:{'Content-Type':'application/json'},body:body}))
    .then(r=>{if(!r.ok)throw new Error('http '+r.status);svOk=true})
    .catch(()=>{svOk=false})
    .then(()=>{pend--;tagSave()});
}
window.addEventListener('beforeunload',e=>{if(modoServidor&&(pend||!svOk)){e.preventDefault();e.returnValue=''}});
async function boot(){
  let txt=null;
  try{const r=await fetch('/api/db',{cache:'no-store'});if(r.ok){modoServidor=true;txt=await r.text()}}catch(e){}
  if(!modoServidor){load();render();return}
  if(txt&&txt.trim()){
    try{db=JSON.parse(txt);if(!db||!db.vendas||!db.params)throw 0}
    catch(e){
      modoServidor=false;
      document.body.innerHTML='<div style="max-width:560px;margin:60px auto;font-family:sans-serif"><h2>Não foi possível ler o arquivo de dados</h2><p>O arquivo <b>dados\\caixa.json</b> parece danificado. <b>Nada foi apagado nem alterado.</b> Feche o sistema, abra a pasta <b>dados\\backups</b> e copie o arquivo mais recente por cima de <b>caixa.json</b>.</p></div>';
      return;
    }
  }else db=DEF();
  normalizar();render();
}

function custoProd(p){
  if(p.receita&&p.receita.length)return r4(p.receita.reduce((s,r)=>{const i=insumo(r.ins);return s+(i?i.custo*r.qtd:0)},0));
  return p.custo||0;
}
function pinOk(){

}

function chaveAj(el){
  let t='';
  if(el.tagName==='LABEL'){for(const n of el.childNodes)if(n.nodeType===3)t+=n.nodeValue}
  else for(const n of el.childNodes){if(n.nodeType===3)t+=n.nodeValue;else if(n.nodeType===1&&!n.classList.contains('ib'))t+=n.textContent}
  return t.replace(/\s+/g,' ').replace(/^[^\p{L}\p{N}]+/u,'').trim();
}
function acharAj(k,t){const h=AJ_EXATO.get(tela+'|'+k)||AJ_EXATO.get(k);if(h)return h;const r=AJ_REGEX.find(a=>a[0].test(t));return r?r[1]:null}
function decorar(root){
  (root||document).querySelectorAll('h2,h3,h4,th,label,.kpi small').forEach(el=>{
    if(el.querySelector(':scope > .ib'))return;
    const t=chaveAj(el);if(!t)return;
    const k=(el.tagName==='TH'?'th:':'')+t;const h=acharAj(k,t);if(!h){(window.__sem=window.__sem||[]).push(t);return}
    const i=document.createElement('span');i.className='ib';i.tabIndex=0;i.setAttribute('role','button');i.setAttribute('aria-label','O que é: '+t);i.title='Clique para ver o que é';i.textContent='i';
    i.dataset.t=t;i.dataset.h=h;
    const f=el.tagName==='LABEL'&&!el.classList.contains('chk')?el.querySelector('input,select,textarea'):null;
    if(f&&f.parentNode===el)el.insertBefore(i,f);else el.appendChild(i);
  });
}
function mostrarAj(b){
  const pop=$('#pop');
  if(pop.style.display==='block'&&pop.dataset.dono===b.dataset.t+b.dataset.h&&pop._b===b){fecharAj();return}
  pop.innerHTML='';const tt=document.createElement('b');tt.textContent=b.dataset.t.replace(/\s*[—:(].*$/,'')||b.dataset.t;pop.appendChild(tt);
  b.dataset.h.split('\n').forEach((l,k)=>{if(k)pop.appendChild(document.createElement('br'));pop.appendChild(document.createTextNode(l))});
  pop.dataset.dono=b.dataset.t+b.dataset.h;pop._b=b;pop.style.display='block';
  const r=b.getBoundingClientRect(),w=pop.offsetWidth,h=pop.offsetHeight;
  let x=Math.min(Math.max(8,r.left-8),innerWidth-w-8),y=r.bottom+8;if(y+h>innerHeight-8)y=Math.max(8,r.top-h-8);
  pop.style.left=x+'px';pop.style.top=y+'px';
}

function vendasPeriodo(a,b){return db.vendas.filter(v=>v.status==='ok'&&dia(v.ts)>=a&&dia(v.ts)<=b)}
function despPeriodo(a,b){return db.despesas.filter(d=>d.data>=a&&d.data<=b)}
function resumo(vs){
  const r={n:vs.length,sub:0,desc:0,total:0,taxas:0,cmv:0,porForma:{din:0,pix:0,deb:0,cre:0},porProd:{},porComp:{},porCat:{},porDia:{},porHora:{}};
  for(const v of vs){
    r.sub+=v.subtotal;r.desc+=v.desconto;r.total+=v.total;r.taxas+=v.taxas||0;
    for(const p of v.pags)r.porForma[p.forma]=(r.porForma[p.forma]||0)+p.valor;
    const f=v.subtotal?v.total/v.subtotal:1;
    for(const i of v.itens){
      const rec=i.qtd*i.preco*f,c=i.qtd*i.custo;r.cmv+=c;
      for(const a of (i.acomp||[])){const o=r.porComp[a.nome]||(r.porComp[a.nome]={n:0,qtd:0,custo:0,un:a.un});o.n+=i.peso?1:i.qtd;o.qtd+=a.qtd;o.custo+=a.custo}
      const o=r.porProd[i.nome]||(r.porProd[i.nome]={qtd:0,rec:0,custo:0});o.qtd+=i.qtd;o.rec+=rec;o.custo+=c;
      const k=i.cat||'—';const oc=r.porCat[k]||(r.porCat[k]={qtd:0,rec:0,custo:0});oc.qtd+=i.qtd;oc.rec+=rec;oc.custo+=c;
    }
    const d=dia(v.ts);r.porDia[d]=(r.porDia[d]||0)+v.total;
    const h=hora(v.ts);r.porHora[h]=(r.porHora[h]||0)+v.total;
  }
  r.ticket=r.n?r.total/r.n:0;return r;
}
function barras(dados,h){

    return '<rect x="'+(i*bw+6)+'" y="'+(h-bh+12)+'" width="'+(bw-12)+'" height="'+bh+'" rx="4" style="fill:var(--barra)"/>'

}

  +'<div class="row" style="margin-top:10px"><button class="btn red" onclick="if(!cart.length||confirm(\'Limpar a venda?\')){cart=[];descCart={tipo:\'v\',valor:0};render()}">Limpar</button><button class="btn ok" style="flex:1;font-size:16px" '+(cart.length?'':'disabled')+' onclick="abrirPag()">Receber</button></div></div></div>';
}
function addCart(pid){
  const p=db.produtos.find(x=>x.id===pid);if(!p)return;
  if(p.porPeso){
    modal('<h3>'+esc(p.nome)+'</h3><label>Peso do prato (gramas)<input id="gr" inputmode="decimal" autofocus onkeydown="if(event.key===\'Enter\')okPeso(\''+pid+'\')"></label><p class="muted">Preço: '+brl(p.preco)+' por kg</p><div class="acts"><button class="btn gray" onclick="fechar()">Cancelar</button><button class="btn" onclick="okPeso(\''+pid+'\')">Adicionar</button></div>');

function okPeso(pid){

  fechar();render();
}
function qtdCart(k,d){cart[k].qtd+=d;if(cart[k].qtd<=0)cart.splice(k,1);render()}
/* ============ COMPLEMENTOS (montagem) ============ */
/* Complemento = acompanhamento SEM cobrança, ligado a um insumo do estoque, com quantidade por copo.
   Adicional (cobrado) = produto normal vendido à parte. */
let mont=null;
const itemTot=i=>r2(i.qtd*i.preco);
const uiUn=s=>!s?{f:1,un:''}:s.un==='kg'?{f:1000,un:'g'}:s.un==='L'?{f:1000,un:'ml'}:{f:1,un:s.un};
const compQtd=(p,c)=>(p&&p.compQtd&&p.compQtd[c.id]!=null)?p.compQtd[c.id]:c.qtd;
const fmtQ=(s,q)=>{const u=uiUn(s);return num(r4(q*u.f))+' '+u.un};
const fmtUn=(q,un)=>un==='kg'?num(r4(q*1000))+' g':un==='L'?num(r4(q*1000))+' ml':num(r4(q))+' '+un;
function opcoesComp(p){return db.complementos.filter(c=>c.ativo!==false&&insumo(c.ins)&&!((p.compOff||[]).includes(c.id)))}
function descMont(i){
  const n=(i.cs||[]).map(id=>{const c=db.complementos.find(x=>x.id===id);return c?esc(c.nome):''}).filter(Boolean);
  return (n.length?'<br><small>+ '+n.join(', ')+'</small>':'')+(i.obs?'<br><small class="muted">Obs: '+esc(i.obs)+'</small>':'');
}
function acompDe(i){
  const p=db.produtos.find(x=>x.id===i.pid);
  return (i.cs||[]).map(id=>{
    const c=db.complementos.find(x=>x.id===id),s=c&&insumo(c.ins);if(!c||!s)return null;
    const q=r4(compQtd(p,c)*(i.peso?1:i.qtd));
    return{cid:c.id,nome:c.nome,ins:c.ins,qtd:q,un:s.un,custo:r4(q*s.custo)};
  }).filter(Boolean);
}
function montar(pid,k,kg){
  const p=db.produtos.find(x=>x.id===pid);if(!p)return;
  mont={pid:pid,k:k,kg:kg||0,sel:{},obs:''};
  if(k!=null&&cart[k]){const it=cart[k];mont.kg=it.peso?it.qtd:0;mont.obs=it.obs||'';(it.cs||[]).forEach(id=>{mont.sel[id]=true})}
  montTela();
}
function montTela(){
  const p=db.produtos.find(x=>x.id===mont.pid),ops=opcoesComp(p);
  modal('<h3>Montar: '+esc(p.nome)+'</h3><p class="muted" style="margin:0 0 6px">'+(mont.kg?num(mont.kg*1000)+' g × '+brl(p.preco)+'/kg':brl(p.preco))+' · complementos sem custo para o cliente</p>'
   +'<h4>Complementos</h4>'
   +(ops.length?'<p class="muted" style="margin:0 0 8px">Toque nos que o cliente pediu.</p><div class="mgrid">'+ops.map(c=>'<div class="mtile'+(mont.sel[c.id]?' on':'')+'" id="mo_'+c.id+'" onclick="montT(\''+c.id+'\')"><b>'+esc(c.nome)+'</b><br><small class="muted">'+fmtQ(insumo(c.ins),compQtd(p,c))+'</small></div>').join('')+'</div>'
     :'<p class="warn">Nenhum complemento disponível para este produto. Cadastre em <b>Complementos</b> (menu lateral) ou confira se o produto não os desmarcou.</p>')
   +'<label style="margin-top:12px">Observação (opcional)<input id="m_obs" value="'+esc(mont.obs)+'" placeholder="Ex.: sem granola, calda separada" oninput="mont.obs=this.value"></label>'
   +'<div class="acts"><button class="btn gray" onclick="mont=null;fechar()">Cancelar</button><button class="btn ok" onclick="okMont()">'+(mont.k!=null?'Salvar alterações':'Adicionar à venda')+'</button></div>',true);
}
function montT(id){mont.sel[id]=!mont.sel[id];const e=$('#mo_'+id);if(e)e.classList.toggle('on',!!mont.sel[id])}
function okMont(){
  if(!mont)return;
  const p=db.produtos.find(x=>x.id===mont.pid);
  const cs=opcoesComp(p).filter(c=>mont.sel[c.id]).map(c=>c.id),obs=(mont.obs||'').trim();
  if(mont.k!=null&&cart[mont.k])Object.assign(cart[mont.k],{cs:cs,obs:obs});
  else cart.push({pid:p.id,nome:p.nome,cat:p.cat,qtd:mont.kg||1,preco:p.preco,custo:custoProd(p),peso:!!mont.kg,cs:cs,obs:obs,mont:true});
  mont=null;fechar();render();
}
function editMont(k){const it=cart[k];if(it)montar(it.pid,k,0)}

/* ============ tela COMPLEMENTOS (cadastro) ============ */
function tCompl(){

    return '<tr style="'+(c.ativo===false?'opacity:.5':'')+'"><td>'+esc(c.nome)+'</td><td>'+(s?esc(s.nome):'<span class="tag r">insumo removido</span>')+'</td><td class="n">'+(s?fmtQ(s,c.qtd):'—')+'</td><td>'+(c.ativo===false?'<span class="tag y">Inativo</span>':'<span class="tag g">Ativo</span>')+'</td><td class="n"><button class="btn sm gray" onclick="editCompl(\''+c.id+'\')">Editar</button> <button class="btn sm red" onclick="delCompl(\''+c.id+'\')">✕</button></td></tr>'}).join('');

function editCompl(id){
  if(!db.insumos.length){alert('Cadastre primeiro os insumos (granola, paçoca...) em Estoque.');return}
  const c=id?db.complementos.find(x=>x.id===id):{nome:'',ins:db.insumos[0].id,qtd:0,ativo:true};
  const s=insumo(c.ins)||db.insumos[0],u=uiUn(s);
  modal('<h3>'+(id?'Editar':'Novo')+' complemento</h3><label>Nome<input id="c_nome" value="'+esc(c.nome)+'" placeholder="Ex.: Granola"></label>'
   +'<label>Insumo do estoque<select id="c_ins" onchange="comUn()">'+db.insumos.map(x=>'<option value="'+x.id+'" '+(x.id===s.id?'selected':'')+'>'+esc(x.nome)+' ('+esc(x.un)+')</option>').join('')+'</select></label>'
   +'<label>Quantidade por copo (<span id="c_un">'+u.un+'</span>)<input id="c_qtd" inputmode="decimal" value="'+(c.qtd?fin(r4(c.qtd*u.f)):'')+'" placeholder="Ex.: 30"></label>'
   +'<label class="chk"><input type="checkbox" id="c_ativo" '+(c.ativo!==false?'checked':'')+'> Ativo (aparece na montagem)</label>'
   +'<div class="acts"><button class="btn gray" onclick="fechar()">Cancelar</button><button class="btn" onclick="saveCompl(\''+(id||'')+'\')">Salvar</button></div>');
}
function comUn(){const s=insumo($('#c_ins').value);$('#c_un').textContent=uiUn(s).un}
function saveCompl(id){
  const nome=$('#c_nome').value.trim(),ins=$('#c_ins').value,s=insumo(ins),u=uiUn(s),q=r4(pn($('#c_qtd').value)/u.f);
  if(!nome){alert('Informe o nome do complemento.');return}
  if(!(q>0)){alert('Informe a quantidade que vai em cada copo.');return}
  const d={nome:nome,ins:ins,qtd:q,ativo:$('#c_ativo').checked};
  if(id)Object.assign(db.complementos.find(x=>x.id===id),d);else db.complementos.push(Object.assign({id:uid()},d));
  save();fechar();render();
}
function delCompl(id){if(confirm('Excluir este complemento? As vendas antigas continuam no histórico.')){db.complementos=db.complementos.filter(x=>x.id!==id);save();render()}}
function compBoxHTML(p){
  const cs=db.complementos.filter(c=>c.ativo!==false);
  let h='<div id="compBox" class="card" style="display:'+(p.complementos?'block':'none')+';margin:6px 0 10px;padding:10px"><h4 style="margin-top:0">Complementos que acompanham este produto</h4>';
  if(!cs.length)h+='<p class="muted">Nenhum complemento cadastrado. Cadastre em <b>Complementos</b> (menu lateral) e depois volte aqui.</p>';
  else h+='<p class="muted" style="margin:0 0 8px">Marque os que este produto oferece e ajuste a quantidade que vai em <b>cada unidade</b> dele.</p>'+cs.map(c=>{
    const s=insumo(c.ins),u=uiUn(s),on=!(p.compOff||[]).includes(c.id),q=compQtd(p,c);
    return '<div class="row" style="margin-bottom:6px"><label class="chk" style="flex:1;margin:0"><input type="checkbox" id="pc_'+c.id+'" '+(on?'checked':'')+'> '+esc(c.nome)+'</label><input id="pq_'+c.id+'" style="width:90px" inputmode="decimal" value="'+fin(r4(q*u.f))+'"><span class="muted" style="width:30px">'+u.un+'</span></div>';
  }).join('');
  return h+'</div>';
}
function lerCompBox(){
  const off=[],qtd={};
  db.complementos.forEach(c=>{
    const ck=$('#pc_'+c.id);if(!ck)return;
    if(!ck.checked)off.push(c.id);
    const u=uiUn(insumo(c.ins)),v=r4(pn($('#pq_'+c.id).value)/u.f);
    if(v>0&&Math.abs(v-c.qtd)>1e-9)qtd[c.id]=v;
  });
  return{compOff:off,compQtd:qtd};
}
function abrirPag(){if(!cart.length)return;pags=[];modalPag()}
function modalPag(){
  const t=cartTot(),rec=r2(pags.reduce((s,p)=>s+p.valor,0)),falta=r2(t.total-rec),troco=rec>t.total?r2(rec-t.total):0;
  modal('<h3>Pagamento — '+brl(t.total)+'</h3>'
   +(pags.length?'<table>'+pags.map((p,i)=>'<tr><td>'+FN(p.forma)+'</td><td class="n">'+brl(p.valor)+'</td><td class="n"><button class="qb" onclick="pags.splice('+i+',1);modalPag()">✕</button></td></tr>').join('')+'</table>':'')
   +'<label style="margin-top:10px">Valor recebido<input id="pv" inputmode="decimal" value="'+(falta>0?fin(falta.toFixed(2)):'')+'"></label>'
   +'<div class="row">'+FORMAS.map(f=>'<button class="btn '+f.c+'" onclick="addPag(\''+f.k+'\')">'+f.n+'</button>').join('')+'</div>'
   +'<div class="row sp" style="margin-top:12px"><span>Recebido: <b>'+brl(rec)+'</b></span>'+(falta>0?'<span class="neg">Falta '+brl(falta)+'</span>':'<span class="pos">Troco: '+brl(troco)+'</span>')+'</div>'
   +'<div class="acts"><button class="btn gray" onclick="fechar()">Voltar</button><button class="btn ok" '+(falta>0?'disabled':'')+' onclick="finalizar()">Finalizar venda</button></div>');
  setTimeout(()=>{const e=$('#pv');if(e){e.focus();e.select()}},50);
}
function addPag(k){
  const t=cartTot(),rec=r2(pags.reduce((s,p)=>s+p.valor,0)),falta=r2(t.total-rec);
  let v=r2(pn($('#pv').value));if(v<=0||falta<=0)return;
  if(k!=='din'&&v>falta)v=falta;
  pags.push({forma:k,valor:v});modalPag();
}
function finalizar(){
  const cx=caixaAberto();if(!cx||!cart.length)return;
  const t=cartTot(),rec=r2(pags.reduce((s,p)=>s+p.valor,0));
  if(rec<t.total)return;
  const troco=r2(rec-t.total),din=r2(pags.filter(p=>p.forma==='din').reduce((s,p)=>s+p.valor,0));
  if(troco>din){alert('O troco só pode sair do valor pago em dinheiro.');return}
  const pf=pags.map(p=>({forma:p.forma,valor:p.valor}));
  let rest=troco;for(const p of pf){if(p.forma==='din'&&rest>0){const x=Math.min(p.valor,rest);p.valor=r2(p.valor-x);rest=r2(rest-x)}}
  const pfin=pf.filter(p=>p.valor>0);
  const taxas=r2(pfin.reduce((s,p)=>s+p.valor*taxaForma(p.forma)/100,0));
  const v={id:uid(),num:++db.seq,caixaId:cx.id,ts:Date.now(),itens:cart.map(i=>{const ac=acompDe(i),cc=ac.reduce((s,c)=>s+c.custo,0);return{pid:i.pid,nome:i.nome,cat:i.cat,qtd:i.qtd,preco:i.preco,custo:r4(i.custo+(i.qtd?cc/i.qtd:0)),peso:i.peso,obs:i.obs||undefined,acomp:ac.length?ac:undefined}}),subtotal:t.sub,desconto:t.d,total:t.total,pags:pfin,troco:troco,taxas:taxas,status:'ok'};
  for(const i of v.itens){const p=db.produtos.find(x=>x.id===i.pid);if(p&&p.receita)for(const r of p.receita){const s=insumo(r.ins);if(s)s.estoque=r4(s.estoque-r.qtd*i.qtd)}(i.acomp||[]).forEach(c=>{const s=insumo(c.ins);if(s)s.estoque=r4(s.estoque-c.qtd)})}
  db.vendas.push(v);save();cart=[];descCart={tipo:'v',valor:0};pags=[];
  modal('<h3>Venda #'+v.num+' registrada ✔</h3>'+(troco>0?'<p style="font-size:22px">Troco: <b class="pos">'+brl(troco)+'</b></p>':'')
   +'<div class="acts"><button class="btn gray" onclick="imprimir(reciboHTML(db.vendas.find(x=>x.id===\''+v.id+'\')))">🖨 Imprimir cupom</button><button class="btn" onclick="fechar();render()">Nova venda</button></div>');
  render();
}
function lin(a,b){return '<div style="display:flex;justify-content:space-between;gap:8px"><span>'+a+'</span><span>'+b+'</span></div>'}
function reciboHTML(v){
  const P=db.params;
  return '<div style="font-family:monospace;width:290px;font-size:12px"><div style="text-align:center">'+(P.logo?'<img alt="" src="'+P.logo+'" style="width:56px;height:56px;border-radius:12px;object-fit:cover"><br>':'')+'<b>'+esc(P.nome)+'</b><br>Venda nº '+v.num+'<br>'+fdata(v.ts)+'</div><hr>'
  +v.itens.map(i=>(i.comp?'&nbsp;&nbsp;+ ':'')+esc(i.nome)+lin('&nbsp;&nbsp;'+(i.peso?num(i.qtd*1000)+' g':num(i.qtd)+' x '+brl(i.preco)),brl(i.qtd*i.preco))+(i.acomp&&i.acomp.length?'<div style="font-size:11px">&nbsp;&nbsp;Acomp.: '+i.acomp.map(c=>esc(c.nome)).join(', ')+'</div>':'')+(i.obs?'<div style="font-size:11px">&nbsp;&nbsp;Obs: '+esc(i.obs)+'</div>':'')).join('')+'<hr>'
  +lin('Subtotal',brl(v.subtotal))+(v.desconto?lin('Desconto','- '+brl(v.desconto)):'')+'<b>'+lin('TOTAL',brl(v.total))+'</b><hr>'
  +v.pags.map(p=>lin(FN(p.forma),brl(p.valor))).join('')+(v.troco?lin('Troco',brl(v.troco)):'')
  +'<hr><div style="text-align:center">'+esc(P.rodape)+'</div></div>';

/* ============ CAIXA ============ */
function abrirCaixa(){
  const ult=db.caixas.filter(c=>c.status==='fechado').slice(-1)[0];
  modal('<h3>Abrir caixa</h3><label>Operador<input id="op" value="'+esc(ult?ult.operador:'')+'"></label><label>Troco inicial (dinheiro na gaveta)<input id="ini" inputmode="decimal" value="0"></label><div class="acts"><button class="btn gray" onclick="fechar()">Cancelar</button><button class="btn ok" onclick="okAbrir()">Abrir</button></div>');

function okAbrir(){
  if(caixaAberto())return;

}
function resCaixa(id){

  return{c:c,r:r,m:m,sup:sup,san:san,esperado:r2(c.inicial+r.porForma.din+sup-san),canc:db.vendas.filter(v=>v.caixaId===id&&v.status!=='ok').length};
}

    +'<div class="cols"><div class="card"><h3>Vendas por forma</h3><table>'+FORMAS.map(f=>'<tr><td>'+f.n+'</td><td class="n">'+brl(x.r.porForma[f.k])+'</td></tr>').join('')+'</table></div>'
    +'<div class="card"><h3>Movimentações</h3>'+(x.m.length?'<table>'+x.m.map(m=>'<tr><td>'+fdata(m.ts)+'</td><td>'+(m.tipo==='sup'?'Suprimento':'Sangria')+'</td><td>'+esc(m.motivo)+'</td><td class="n">'+brl(m.valor)+'</td></tr>').join('')+'</table>':'<p class="muted">Nenhuma.</p>')+'</div></div>';

function modalFechar(){
  const cx=caixaAberto(),x=resCaixa(cx.id);
  modal('<h3>Fechar caixa</h3><div class="row sp"><span>Dinheiro esperado</span><b>'+brl(x.esperado)+'</b></div>'
   +'<label style="margin-top:10px">Dinheiro contado na gaveta<input id="ct" inputmode="decimal" oninput="difF('+x.esperado+')"></label><div id="dif" class="row sp"><span>Diferença</span><b>—</b></div>'
   +'<label style="margin-top:10px">Observações<input id="ob"></label><div class="acts"><button class="btn gray" onclick="fechar()">Cancelar</button><button class="btn red" onclick="okFechar()">Fechar caixa</button></div>');
  setTimeout(()=>$('#ct')&&$('#ct').focus(),50);
}
function difF(esp){const d=r2(pn($('#ct').value)-esp);$('#dif').innerHTML='<span>Diferença</span><b class="'+(d<0?'neg':d>0?'pos':'')+'">'+brl(d)+'</b>'}
function okFechar(){
  const cx=caixaAberto(),x=resCaixa(cx.id);
  const ct=$('#ct').value.trim();if(ct===''){alert('Informe o dinheiro contado.');return}
  const c=r2(pn(ct));
  Object.assign(cx,{status:'fechado',fim:Date.now(),contado:c,esperado:x.esperado,diferenca:r2(c-x.esperado),vendasTotal:r2(x.r.total),obs:$('#ob').value.trim()});
  save();fechar();render();verFech(cx.id);
}
function fechHTML(id){
  const x=resCaixa(id),c=x.c;
  return '<div style="font-family:Segoe UI,Arial;font-size:13px;width:100%"><h3 style="margin:0">'+esc(db.params.nome)+' — Fechamento de caixa</h3>'
  +'<p>Operador: <b>'+esc(c.operador)+'</b><br>Abertura: '+fdata(c.ts)+(c.fim?'<br>Fechamento: '+fdata(c.fim):'')+'</p>'
  +lin('Troco inicial',brl(c.inicial))+lin('Vendas ('+x.r.n+')',brl(x.r.total))
  +FORMAS.map(f=>lin('&nbsp;&nbsp;'+f.n,brl(x.r.porForma[f.k]))).join('')
  +lin('Suprimentos','+ '+brl(x.sup))+lin('Sangrias','− '+brl(x.san))+lin('Descontos concedidos',brl(x.r.desc))+lin('Vendas canceladas',x.canc)+'<hr>'
  +'<b>'+lin('Dinheiro esperado',brl(c.esperado!=null?c.esperado:x.esperado))+'</b>'
  +(c.contado!=null?lin('Dinheiro contado',brl(c.contado))+'<b>'+lin('Diferença',brl(c.diferenca))+'</b>':'')
  +(c.obs?'<p>Obs.: '+esc(c.obs)+'</p>':'')+'</div>';
}
function verFech(id){modal(fechHTML(id)+'<div class="acts"><button class="btn gray" onclick="imprimir(fechHTML(\''+id+'\'))">🖨 Imprimir</button><button class="btn" onclick="fechar()">Fechar</button></div>')}

/* ============ VENDAS ============ */
function tVendas(){
  const vs=db.vendas.filter(v=>dia(v.ts)>=vf.a&&dia(v.ts)<=vf.b).slice().reverse();
  const tot=vs.filter(v=>v.status==='ok').reduce((s,v)=>s+v.total,0);
  return '<h2>Vendas</h2><div class="card"><div class="row"><label style="margin:0">De<input type="date" value="'+vf.a+'" onchange="vf.a=this.value;render()"></label><label style="margin:0">Até<input type="date" value="'+vf.b+'" onchange="vf.b=this.value;render()"></label><div style="flex:1"></div><b>Total válido: '+brl(tot)+'</b></div></div>'
  +'<div class="card">'+(vs.length?'<table><tr><th>Nº</th><th>Data</th><th>Itens</th><th>Pagamento</th><th class="n">Total</th><th>Status</th><th></th></tr>'
  +vs.map(v=>'<tr><td>'+v.num+'</td><td>'+fdata(v.ts)+'</td><td>'+esc(v.itens.map(i=>(i.comp?'+ ':'')+(i.peso?num(i.qtd*1000)+'g ':num(i.qtd)+'x ')+i.nome+(i.acomp&&i.acomp.length?' ('+i.acomp.map(c=>c.nome).join(', ')+')':'')).join(', '))+'</td><td>'+v.pags.map(p=>FN(p.forma)).join(' + ')+'</td><td class="n">'+brl(v.total)+'</td><td>'+(v.status==='ok'?'<span class="tag g">OK</span>':'<span class="tag r">Cancelada</span>')+'</td><td class="n"><button class="btn sm" onclick="verVenda(\''+v.id+'\')">Ver</button></td></tr>').join('')+'</table>':'<p class="muted">Nenhuma venda no período.</p>')+'</div>';
}
function verVenda(id){
  const v=db.vendas.find(x=>x.id===id);
  modal(reciboHTML(v)+'<div class="acts"><button class="btn gray" onclick="imprimir(reciboHTML(db.vendas.find(x=>x.id===\''+id+'\')))">🖨 Imprimir</button>'+(v.status==='ok'?'<button class="btn red" onclick="cancelarVenda(\''+id+'\')">Cancelar venda</button>':'')+'<button class="btn" onclick="fechar()">Fechar</button></div>');
}
function cancelarVenda(id){
  const v=db.vendas.find(x=>x.id===id),c=db.caixas.find(x=>x.id===v.caixaId);
  if(c&&c.status!=='aberto'){alert('Esta venda pertence a um caixa já fechado e não pode ser cancelada.');return}
  if(!pinOk())return;
  if(!confirm('Cancelar a venda #'+v.num+'? O estoque será devolvido.'))return;
  v.status='cancelada';
  for(const i of v.itens){const p=db.produtos.find(x=>x.id===i.pid);if(p&&p.receita)for(const r of p.receita){const s=insumo(r.ins);if(s)s.estoque=r4(s.estoque+r.qtd*i.qtd)}(i.acomp||[]).forEach(c=>{const s=insumo(c.ins);if(s)s.estoque=r4(s.estoque+c.qtd)})}
  save();fechar();render();
}

function addRec(){if(!db.insumos.length){alert('Cadastre insumos primeiro em Estoque.');return}recTmp.push({ins:db.insumos[0].id,qtd:0});renderRec()}
function saveProd(id){

function delProd(id){if(confirm('Excluir este produto? As vendas antigas continuam no histórico.')){db.produtos=db.produtos.filter(x=>x.id!==id);save();render()}}

let cmpTmp=[];
function tComp(){
  const m=hoje().slice(0,7),tm=db.compras.filter(c=>c.data.slice(0,7)===m).reduce((s,c)=>s+c.total,0);
  return '<h2>Compras de estoque</h2><div class="card"><div class="row sp"><span>Comprado neste mês: <b>'+brl(tm)+'</b></span><button class="btn" onclick="novaCompra()">+ Nova compra</button></div></div>'

function novaCompra(){
  if(!db.insumos.length){alert('Cadastre os insumos primeiro em Estoque.');return}
  cmpTmp=[{ins:db.insumos[0].id,qtd:0,total:0}];
  modal('<h3>Nova compra</h3><div class="grid2"><label>Data<input type="date" id="c_data" value="'+hoje()+'"></label><label>Fornecedor<input id="c_forn"></label></div>'
  +'<label>Forma de pagamento<select id="c_pg"><option>Dinheiro</option><option>Pix</option><option>Cartão</option><option>Boleto / a prazo</option></select></label>'
  +'<h4>Itens (quantidade comprada e valor total pago)</h4><div id="cmpRows"></div><button class="btn sm" onclick="cmpTmp.push({ins:db.insumos[0].id,qtd:0,total:0});renderCmp()">+ Item</button><div id="cmpTot" style="text-align:right;font-size:18px;margin-top:8px"></div>'
  +'<div class="acts"><button class="btn gray" onclick="fechar()">Cancelar</button><button class="btn ok" onclick="saveCompra()">Registrar compra</button></div>',true);
  renderCmp();
}
function renderCmp(){
  $('#cmpRows').innerHTML=cmpTmp.map((r,i)=>'<div class="row" style="margin-bottom:6px"><select style="flex:2" onchange="cmpTmp['+i+'].ins=this.value">'+db.insumos.map(s=>'<option value="'+s.id+'" '+(s.id===r.ins?'selected':'')+'>'+esc(s.nome)+' ('+esc(s.un)+')</option>').join('')+'</select><input style="flex:1" placeholder="Qtd" inputmode="decimal" value="'+(r.qtd?fin(r.qtd):'')+'" onchange="cmpTmp['+i+'].qtd=pn(this.value)"><input style="flex:1" placeholder="Total R$" inputmode="decimal" value="'+(r.total?fin(r.total):'')+'" onchange="cmpTmp['+i+'].total=pn(this.value);totCmp()"><button class="qb" onclick="cmpTmp.splice('+i+',1);renderCmp()">✕</button></div>').join('');
  totCmp();
}
function totCmp(){$('#cmpTot').innerHTML='Total: <b>'+brl(cmpTmp.reduce((s,r)=>s+r.total,0))+'</b>'}
function saveCompra(){
  const its=cmpTmp.filter(r=>r.qtd>0&&r.total>0);if(!its.length){alert('Informe ao menos um item com quantidade e valor.');return}
  const itens=[];
  for(const r of its){
    const s=insumo(r.ins),base=Math.max(0,s.estoque);
    s.custo=r4((base*s.custo+r.total)/(base+r.qtd));  // custo médio ponderado
    s.estoque=r4(s.estoque+r.qtd);
    itens.push({ins:r.ins,nome:s.nome,qtd:r.qtd,total:r2(r.total)});
  }
  db.compras.push({id:uid(),data:$('#c_data').value||hoje(),fornecedor:$('#c_forn').value.trim()||'—',pagto:$('#c_pg').value,itens:itens,total:r2(itens.reduce((s,i)=>s+i.total,0))});
  save();fechar();render();
}
function delCompra(id){
  const c=db.compras.find(x=>x.id===id);
  if(!confirm('Excluir esta compra? A quantidade comprada será retirada do estoque (o custo médio não é recalculado).'))return;
  for(const i of c.itens){const s=insumo(i.ins);if(s)s.estoque=r4(s.estoque-i.qtd)}
  db.compras=db.compras.filter(x=>x.id!==id);save();render();
}

/* ============ RELATÓRIOS ============ */
function rangeRel(){
  const h=new Date(),t=hoje();
  if(rel.p==='hoje')return[t,t];
  if(rel.p==='7d'){const d=new Date();d.setDate(d.getDate()-6);return[dia(d.getTime()),t]}
  if(rel.p==='mes')return[t.slice(0,8)+'01',t];
  if(rel.p==='mesAnt'){const a=new Date(h.getFullYear(),h.getMonth()-1,1),b=new Date(h.getFullYear(),h.getMonth(),0);return[dia(a.getTime()),dia(b.getTime())]}
  return[rel.a||t,rel.b||t];
}
function tRel(){
  const[a,b]=rangeRel(),vs=vendasPeriodo(a,b),r=resumo(vs),dp=despPeriodo(a,b),dpT=dp.reduce((s,d)=>s+d.valor,0);
  const cp=db.compras.filter(c=>c.data>=a&&c.data<=b).reduce((s,c)=>s+c.total,0);
  const liq=r.total-r.taxas,bruto=liq-r.cmv,res=bruto-dpT;
  const prods=Object.entries(r.porProd).sort((x,y)=>y[1].rec-x[1].rec);
  const dias=Object.keys(r.porDia).sort();
  const cxs=db.caixas.filter(c=>c.status==='fechado'&&dia(c.ts)>=a&&dia(c.ts)<=b);
  const horas=[];for(let i=8;i<=23;i++)horas.push({l:pad(i),v:r.porHora[pad(i)]||0});
  const body='<h3>Relatório de '+fdia(a)+' a '+fdia(b)+' — '+esc(db.params.nome)+'</h3>'
  +'<div class="kpis"><div class="kpi"><small>Faturamento</small><b>'+brl(r.total)+'</b></div><div class="kpi"><small>Vendas</small><b>'+r.n+'</b></div><div class="kpi"><small>Ticket médio</small><b>'+brl(r.ticket)+'</b></div><div class="kpi '+(res>=0?'verde':'verm')+'"><small>Resultado estimado</small><b>'+brl(res)+'</b></div></div>'
  +'<div class="cols"><div class="card"><h3>Resultado (DRE simples)</h3><table>'
  +'<tr><td>Vendas brutas</td><td class="n">'+brl(r.sub)+'</td></tr><tr><td>(−) Descontos</td><td class="n">'+brl(r.desc)+'</td></tr><tr><td><b>Faturamento</b></td><td class="n"><b>'+brl(r.total)+'</b></td></tr>'
  +'<tr><td>(−) Taxas de cartão / pix</td><td class="n">'+brl(r.taxas)+'</td></tr><tr><td>(−) Custo dos produtos vendidos</td><td class="n">'+brl(r.cmv)+'</td></tr><tr><td><b>Lucro bruto</b> ('+(r.total?(bruto/r.total*100).toFixed(0):0)+'%)</td><td class="n"><b>'+brl(bruto)+'</b></td></tr>'
  +'<tr><td>(−) Despesas</td><td class="n">'+brl(dpT)+'</td></tr><tr><td><b>Resultado</b></td><td class="n '+(res>=0?'pos':'neg')+'"><b>'+brl(res)+'</b></td></tr>'
  +'<tr><td class="muted">Compras de estoque no período (informativo)</td><td class="n muted">'+brl(cp)+'</td></tr></table></div>'
  +'<div class="card"><h3>Formas de pagamento</h3><table>'+FORMAS.map(f=>'<tr><td>'+f.n+'</td><td class="n">'+brl(r.porForma[f.k])+'</td><td class="n muted">'+(r.total?(r.porForma[f.k]/r.total*100).toFixed(0):0)+'%</td></tr>').join('')+'</table>'
  +'<h3 style="margin-top:14px">Categorias</h3><table>'+Object.entries(r.porCat).sort((x,y)=>y[1].rec-x[1].rec).map(e=>'<tr><td>'+esc(e[0])+'</td><td class="n">'+brl(e[1].rec)+'</td></tr>').join('')+'</table></div></div>'
  +'<div class="card"><h3>Vendas por dia</h3>'+barras(dias.map(d=>({l:d.slice(8)+'/'+d.slice(5,7),v:r.porDia[d]})))+'</div>'
  +'<div class="card"><h3>Vendas por hora</h3>'+barras(horas)+'</div>'
  +'<div class="card"><h3>Produtos</h3>'+(prods.length?'<table><tr><th>Produto</th><th class="n">Qtd</th><th class="n">Receita</th><th class="n">Custo</th><th class="n">Lucro</th><th class="n">Margem</th></tr>'+prods.map(p=>{const l=p[1].rec-p[1].custo;return '<tr><td>'+esc(p[0])+'</td><td class="n">'+num(p[1].qtd)+'</td><td class="n">'+brl(p[1].rec)+'</td><td class="n">'+brl(p[1].custo)+'</td><td class="n">'+brl(l)+'</td><td class="n">'+(p[1].rec?(l/p[1].rec*100).toFixed(0):0)+'%</td></tr>'}).join('')+'</table>':'<p class="muted">Sem vendas.</p>')+'</div>'
  +(Object.keys(r.porComp).length?'<div class="card"><h3>Complementos mais usados</h3><table><tr><th>Complemento</th><th class="n">Vezes</th><th class="n">Quantidade usada</th><th class="n">Custo</th></tr>'+Object.entries(r.porComp).sort((x,y)=>y[1].n-x[1].n).map(e=>'<tr><td>'+esc(e[0])+'</td><td class="n">'+num(e[1].n)+'</td><td class="n">'+fmtUn(e[1].qtd,e[1].un)+'</td><td class="n">'+brl(e[1].custo)+'</td></tr>').join('')+'</table></div>':'')
  +(cxs.length?'<div class="card"><h3>Fechamentos de caixa</h3><table><tr><th>Data</th><th>Operador</th><th class="n">Esperado</th><th class="n">Contado</th><th class="n">Diferença</th></tr>'+cxs.map(c=>'<tr><td>'+fdata(c.ts)+'</td><td>'+esc(c.operador)+'</td><td class="n">'+brl(c.esperado)+'</td><td class="n">'+brl(c.contado)+'</td><td class="n '+(c.diferenca<0?'neg':c.diferenca>0?'pos':'')+'">'+brl(c.diferenca)+'</td></tr>').join('')+'</table></div>':'');
  window._relBody=body;
  return '<h2>Relatórios</h2><div class="card"><div class="row"><select style="width:auto" onchange="rel.p=this.value;render()">'+[['hoje','Hoje'],['7d','Últimos 7 dias'],['mes','Este mês'],['mesAnt','Mês passado'],['custom','Período livre']].map(o=>'<option value="'+o[0]+'" '+(rel.p===o[0]?'selected':'')+'>'+o[1]+'</option>').join('')+'</select>'
  +(rel.p==='custom'?'<input type="date" style="width:auto" value="'+a+'" onchange="rel.a=this.value;render()"><input type="date" style="width:auto" value="'+b+'" onchange="rel.b=this.value;render()">':'')
  +'<div style="flex:1"></div><button class="btn gray" onclick="imprimir(window._relBody)">🖨 Imprimir</button><button class="btn gray" onclick="expVendas()">⬇ Vendas (Excel/CSV)</button><button class="btn gray" onclick="expProd()">⬇ Produtos (CSV)</button></div></div><div id="relBody">'+body+'</div>';
}
function expVendas(){
  const[a,b]=rangeRel(),L=[['Nº','Data','Hora','Itens','Pagamento','Subtotal','Desconto','Total','Taxas','Status']];
  db.vendas.filter(v=>dia(v.ts)>=a&&dia(v.ts)<=b).forEach(v=>L.push([v.num,fdia(dia(v.ts)),hora(v.ts)+':'+pad(new Date(v.ts).getMinutes()),v.itens.map(i=>i.nome).join(' + '),v.pags.map(p=>FN(p.forma)+' '+fcsv(p.valor)).join(' + '),fcsv(v.subtotal),fcsv(v.desconto),fcsv(v.total),fcsv(v.taxas||0),v.status]));
  baixar('vendas_'+a+'_a_'+b+'.csv',csv(L),'text/csv');
}
function expProd(){
  const[a,b]=rangeRel(),r=resumo(vendasPeriodo(a,b)),L=[['Produto','Quantidade','Receita','Custo','Lucro']];
  Object.entries(r.porProd).forEach(([n,p])=>L.push([n,fcsv(r4(p.qtd)),fcsv(r2(p.rec)),fcsv(r2(p.custo)),fcsv(r2(p.rec-p.custo))]));
  baixar('produtos_'+a+'_a_'+b+'.csv',csv(L),'text/csv');
}

/* ============ PARÂMETROS / BACKUP ============ */
function tPar(){
  const P=db.params,bk=P.lastBackup?new Date(P.lastBackup).toLocaleString('pt-BR'):'nunca';
  return '<h2>Parâmetros</h2><div class="cols">'+aparenciaCard()+'<div class="card"><h3>Negócio</h3><label>Nome da açaiteria<input id="s_nome" value="'+esc(P.nome)+'"></label><label>Rodapé do cupom<input id="s_rod" value="'+esc(P.rodape)+'"></label>'
  +'<label>PIN do gerente (pedido ao cancelar venda e fazer sangria; deixe vazio para desativar)<input id="s_pin" value="'+esc(P.pin)+'"></label></div>'
  +'<div class="card"><h3>Taxas e metas</h3><div class="grid2"><label>Taxa cartão débito (%)<input id="s_td" inputmode="decimal" value="'+fin(P.taxaDebito)+'"></label><label>Taxa cartão crédito (%)<input id="s_tc" inputmode="decimal" value="'+fin(P.taxaCredito)+'"></label><label>Taxa Pix (%)<input id="s_tp" inputmode="decimal" value="'+fin(P.taxaPix)+'"></label><label>Estoque mínimo padrão<input id="s_em" inputmode="decimal" value="'+fin(P.estoqueMin)+'"></label><label>Meta de faturamento diária (R$)<input id="s_md" inputmode="decimal" value="'+fin(P.metaDia)+'"></label><label>Meta mensal (R$)<input id="s_mm" inputmode="decimal" value="'+fin(P.metaMes)+'"></label></div></div></div>'
  +'<div class="card"><h3>Categorias</h3><div class="grid2"><label>Categorias de produtos (separe por vírgula)<input id="s_cp" value="'+esc(P.catProd.join(', '))+'"></label><label>Categorias de despesas (separe por vírgula)<input id="s_cd" value="'+esc(P.catDesp.join(', '))+'"></label></div><button class="btn" onclick="savePar()">Salvar parâmetros</button></div>'
  +'<div class="card"><h3>Backup dos dados</h3>'+(modoServidor?'<p>Seus dados são gravados <b>automaticamente no disco</b>, no arquivo <b>dados\\caixa.json</b> (na pasta do sistema). Uma cópia de cada dia fica em <b>dados\\backups</b> (últimos 60 dias). De vez em quando, copie a pasta <b>dados</b> para um pen drive ou para a nuvem. O botão abaixo gera um arquivo extra de backup. Último backup manual: <b>'+bk+'</b>.</p>':'<p>⚠ Você abriu o arquivo direto, sem o servidor. Os dados ficam <b>só neste navegador</b>. Para gravar em disco, abra pelo <b>Iniciar Caixa.bat</b>. Último backup: <b>'+bk+'</b>.</p>')+'<div class="row"><button class="btn ok" onclick="backup()">⬇ Fazer backup agora</button><button class="btn gray" onclick="$(\'#imp\').click()">⬆ Restaurar backup</button><input type="file" id="imp" accept=".json" style="display:none" onchange="restaurar(this.files[0])"><button class="btn red" onclick="zerar()">Apagar tudo</button></div></div>';
}
function savePar(){
  const P=db.params,L=s=>s.split(',').map(x=>x.trim()).filter(Boolean);
  P.nome=$('#s_nome').value.trim()||'Minha Açaiteria';P.rodape=$('#s_rod').value;P.pin=$('#s_pin').value.trim();
  P.taxaDebito=pn($('#s_td').value);P.taxaCredito=pn($('#s_tc').value);P.taxaPix=pn($('#s_tp').value);P.estoqueMin=pn($('#s_em').value);P.metaDia=pn($('#s_md').value);P.metaMes=pn($('#s_mm').value);
  const cp=L($('#s_cp').value),cd=L($('#s_cd').value);if(cp.length)P.catProd=cp;if(cd.length)P.catDesp=cd;
  save();render();alert('Parâmetros salvos.');
}
function backup(){
  db.params.lastBackup=Date.now();save();
  baixar('backup_acaiteria_'+hoje()+'.json',JSON.stringify(db),'application/json');render();
}
function restaurar(f){
  if(!f)return;const rd=new FileReader();
  rd.onload=()=>{try{const d=JSON.parse(rd.result);if(!d.params||!d.vendas)throw 0;if(!confirm('Isso substitui TODOS os dados atuais pelos do backup. Continuar?'))return;db=d;normalizar();save();render();alert('Backup restaurado.')}catch(e){alert('Arquivo de backup inválido.')}};
  rd.readAsText(f);
}
function zerar(){if(confirm('Apagar TODOS os dados? Faça um backup antes!')&&confirm('Tem certeza? Esta ação não pode ser desfeita.')){db=DEF();save();render()}}
